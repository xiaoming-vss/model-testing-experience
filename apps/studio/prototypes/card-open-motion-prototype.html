<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片进入阅读区 · 动效探索</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#edf2f8;color:#263b57;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #578ce0;outline-offset:2px}.stage{width:100%;height:100vh;overflow:auto}.frame{position:relative;width:100%;aspect-ratio:2305/1488;min-width:900px;background:#f7f9fd}.reference{display:block;width:100%;height:auto}.hit{position:absolute;left:69.2%;top:18%;width:5.7%;height:5.8%;border:0;background:transparent;border-radius:8px;cursor:pointer}.hit:focus-visible{outline:3px solid #3876d4;outline-offset:3px}.hit:hover{background:#fff3}.tip{position:absolute;left:69.2%;top:25%;font-size:12px;color:#315f9f;background:#fff;border:1px solid #dbe7f6;box-shadow:0 3px 10px #2d49671c;border-radius:6px;padding:5px 9px;white-space:nowrap;pointer-events:none}.reader{position:absolute;left:.45%;top:7.6%;width:85.2%;height:91%;border:1px solid #dce7f3;border-radius:10px;background:#fff;overflow:hidden;transform-origin:85% 13%;box-shadow:0 6px 20px #243d5a10}.reader[hidden],.return[hidden]{display:none}.reader-head{height:57px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid #e4ebf4;background:#f8fafd}.reader-head h1{font-size:15px;margin:0}.reader-head .sub{font-size:12px;color:#7d8da2}.reader-head .spacer{flex:1}.mode{display:flex;border-radius:7px;padding:3px;background:#e9eff7;gap:3px}.mode button{border:0;background:transparent;color:#71849a;padding:5px 12px;border-radius:5px}.mode button.active{background:white;color:#3466aa;font-weight:600}.reader-body{height:calc(100% - 57px);overflow:auto;padding:24px 26px}.intro{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #e9eef5;padding-bottom:18px}.intro h2{font-size:18px;margin:0}.intro p{font-size:12px;color:#76889e;margin:5px 0 0}.status{font-size:12px;color:#96601c;background:#fff2db;padding:5px 9px;border-radius:6px}.case{display:grid;grid-template-columns:38px 1fr auto;gap:14px;padding:17px 2px;border-bottom:1px solid #edf1f6;align-items:start}.case .n{color:#93a2b5;font-size:12px}.case strong{font-size:13px}.case p{font-size:12px;color:#788aa1;margin:4px 0 0}.case .tag{font-size:11px;color:#386ab2;background:#eaf2ff;border-radius:5px;padding:4px 7px}.return{position:absolute;top:8.3%;left:87%;width:11.5%;height:auto;min-height:31px;text-align:left;border:0;background:#f8fafd;color:#3d6cae;border-radius:5px;padding:7px 10px;z-index:2}.return:hover{background:#eaf2ff}.description{position:fixed;right:18px;bottom:82px;z-index:5;background:#fff;border:1px solid #dbe6f3;border-radius:9px;padding:12px 15px;box-shadow:0 5px 18px #2a405b18;width:275px}.description b{display:block;color:#294462}.description span{font-size:12px;color:#6c819a}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;background:#293f5e;color:#d9e4f2;border-radius:10px;padding:6px;box-shadow:0 6px 22px #1c314d30}.switch span{padding:0 8px;font-size:12px;white-space:nowrap}.switch button{border:0;border-radius:6px;background:transparent;color:#d9e4f2;padding:8px 11px;white-space:nowrap}.switch button.active{background:white;color:#2f517c}.reader.enter-a{animation:fade-in 280ms ease-out both}.reader.exit-a{animation:fade-out 220ms ease-in both}.reader.enter-b{animation:slide-in 340ms cubic-bezier(.22,1,.36,1) both}.reader.exit-b{animation:slide-out 250ms ease-in both}.reader.enter-c{animation:grow-in 380ms cubic-bezier(.22,1,.36,1) both}.reader.exit-c{animation:grow-out 260ms ease-in both}.reader.enter-d{animation:reveal-in 420ms cubic-bezier(.22,1,.36,1) both}.reader.exit-d{animation:reveal-out 300ms ease-in both}@keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes fade-out{to{opacity:0}}@keyframes slide-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}@keyframes slide-out{to{opacity:0;transform:translateX(24px)}}@keyframes grow-in{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}@keyframes grow-out{to{opacity:0;transform:scale(.93)}}@keyframes reveal-in{from{opacity:.35;clip-path:inset(12% 13% 78% 78% round 10px)}to{opacity:1;clip-path:inset(0 round 10px)}}@keyframes reveal-out{from{opacity:1;clip-path:inset(0 round 10px)}to{opacity:0;clip-path:inset(12% 13% 78% 78% round 10px)}}@media(max-width:900px){.description{width:220px}.switch span{display:none}.switch button{font-size:12px;padding:8px 5px}}@media(prefers-reduced-motion:reduce){.reader{animation-duration:.001ms!important}}
</style></head><body><main class="stage"><div class="frame"><img class="reference" src="card-open-motion-reference.png" alt="需求生成画布及右侧阶段信息示意"><button class="hit" aria-label="打开完整用例：双击或按回车" title="双击打开完整用例"></button><div class="tip" id="hint">双击「完整用例」体验进入</div><section class="reader" id="reader" aria-label="完整用例阅读区" hidden><header class="reader-head"><h1>完整用例</h1><span class="sub">功能测试 · 待审核产物</span><span class="spacer"></span><div class="mode"><button class="active">可视化</button><button>原文</button></div></header><div class="reader-body"><div class="intro"><div><h2>测试用例</h2><p>【localserver】支持配置清洗开关　/　功能测试</p></div><span class="status">待审核 · 28 条用例</span></div><div class="case"><span class="n">01</span><div><strong>开启配置后按规则执行清洗</strong><p>正常流程 · 验证配置生效与处理结果</p></div><span class="tag">候选</span></div><div class="case"><span class="n">02</span><div><strong>关闭清洗开关后保留原始数据</strong><p>开关控制 · 验证关闭状态下的处理行为</p></div><span class="tag">候选</span></div><div class="case"><span class="n">03</span><div><strong>修改配置后重新执行任务</strong><p>配置变更 · 验证新配置生效</p></div><span class="tag">候选</span></div><div class="case"><span class="n">04</span><div><strong>清洗配置缺失时的默认行为</strong><p>异常与边界 · 验证缺省配置的处理</p></div><span class="tag">候选</span></div><p style="font-size:12px;color:#788aa1;margin-top:18px">阅读区内容为示意，重点观察画布与阅读区之间的切换。</p></div></section><button class="return" id="back" hidden>← 返回流程</button></div></main><aside class="description"><b id="name"></b><span id="summary"></span></aside><nav class="switch" aria-label="切换动效方案"><span>进入动效</span><button data-v="a">A 柔和淡入</button><button data-v="b">B 侧向进入</button><button data-v="c">C 从卡片靠近</button><button data-v="d">D 展开揭示</button></nav><script>
let variant=new URLSearchParams(location.search).get('variant')||'a',opened=false,timer;const reader=document.querySelector('#reader'),back=document.querySelector('#back'),hint=document.querySelector('#hint'),hit=document.querySelector('.hit');const info={a:['A · 柔和淡入','画布切换为阅读区时轻柔淡入；最克制，适合高频操作。'],b:['B · 侧向进入','阅读区从右侧短距离滑入；与已有页面切换动效更统一。'],c:['C · 从卡片靠近','阅读区从卡片附近轻微放大进入，强调它来自所选卡片。'],d:['D · 展开揭示','阅读区从卡片附近逐步展开，进入关系更明显，动效也更突出。']};function label(){document.querySelector('#name').textContent=info[variant][0];document.querySelector('#summary').textContent=info[variant][1];document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant))}function openReader(){clearTimeout(timer);opened=true;hint.hidden=true;reader.hidden=false;back.hidden=false;hit.hidden=true;reader.className='reader';void reader.offsetWidth;reader.classList.add('enter-'+variant)}function closeReader(){if(!opened)return;opened=false;back.hidden=true;reader.className='reader exit-'+variant;let duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:variant==='d'?300:260;timer=setTimeout(()=>{reader.hidden=true;reader.className='reader';hint.hidden=false;hit.hidden=false;hit.focus()},duration)}hit.addEventListener('dblclick',openReader);hit.addEventListener('click',e=>{if(e.detail===0)openReader()});back.addEventListener('click',closeReader);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;history.replaceState(null,'','?variant='+variant);label();if(opened)openReader()});label();
</script></body></html>
