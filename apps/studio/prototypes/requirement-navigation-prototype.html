<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求与用例导航 · 方案演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#24344d;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #85aaf0;outline-offset:2px}.shell{display:flex;min-height:100vh}.global{width:176px;flex:none;background:#f5f8fc;border-right:1px solid #dce5f2;padding:18px 12px}.brand{font-weight:750;font-size:18px;margin:0 8px 30px;color:#304c75}.brand b{color:#3864b3}.caption{color:#596b83;font-size:11px;margin:20px 8px 7px}.nav{padding:9px 11px;border-radius:7px;color:#61738d}.nav.active{color:#3265b7;background:#e8f1ff;font-weight:700}.main{min-width:0;flex:1}.top{height:57px;border-bottom:1px solid #dce5f2;background:#f8fafd;display:flex;align-items:center;padding:0 26px;color:#64748b}.top strong{color:#30445f;margin:0 14px}.top .right{margin-left:auto;font-size:12px}.wrap{padding:25px 34px 100px;max-width:1500px;margin:auto}.crumb{color:#596b83;font-size:12px;margin-bottom:12px}.titleline{display:flex;align-items:flex-start;gap:16px}.titleline h1{font-size:21px;line-height:1.4;margin:0;letter-spacing:-.02em}.titleline p{color:#596b83;margin:6px 0 0;font-size:12px}.tag{display:inline-block;background:#eaf2ff;color:#3265b7;border-radius:5px;padding:3px 7px;font-size:11px;white-space:nowrap}.titleline .tag{margin-top:4px}.intro{margin:25px 0 18px;color:#53657d}.intro strong{color:#263a56}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid #dfe7f2;border-radius:10px;overflow:hidden}.panelhead{padding:17px 18px;border-bottom:1px solid #edf1f6;font-weight:700}.tree{padding:10px}.treebutton{width:100%;border:0;background:transparent;text-align:left;border-radius:6px;padding:10px 9px;color:#53657e;display:flex;gap:8px;align-items:center}.treebutton:hover,.treebutton.selected{background:#eaf2ff;color:#285ca9}.treebutton .count{margin-left:auto;color:#71839d;font-size:12px}.indent{padding-left:25px}.small{font-size:12px;color:#7a8aa1}.detail{padding:25px 28px;min-height:490px}.detail h2{margin:0;font-size:18px}.detail .desc{color:#74859a;font-size:13px;margin:7px 0 23px}.status{font-size:12px;color:#a66a16;background:#fff4df;border-radius:5px;padding:4px 8px}.summary{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9eef5;padding-bottom:16px}.summary strong{font-size:15px}.case{padding:16px 2px;border-bottom:1px solid #edf1f6;display:flex;gap:14px;align-items:flex-start}.case .no{color:#91a1b7;font-size:12px;min-width:30px}.case strong{font-size:13px}.case p{margin:5px 0 0;color:#8593a6;font-size:12px}.case .tag{margin-left:auto}.btn{border:1px solid #d4e1f3;background:white;color:#426799;padding:7px 12px;border-radius:6px}.btn.primary{background:#e8f1ff;color:#285ba3}.chain{display:flex;align-items:stretch;margin:18px 0 22px;gap:0}.step{flex:1;text-align:left;background:white;border:1px solid #dfe7f2;padding:16px;min-width:0;color:#53657d}.step:first-child{border-radius:9px 0 0 9px}.step:last-child{border-radius:0 9px 9px 0}.step+.step{border-left:0}.step.selected{background:#edf4ff;color:#275ca8;box-shadow:inset 0 -3px #3864b3}.step small{display:block;color:#7d8ea5;margin-top:5px}.step b{font-size:14px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.plainlist{padding:0 20px}.row{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #edf1f6}.row:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:#63ad82;flex:none}.dot.amber{background:#d3a04b}.row .meta{margin-left:auto;color:#8190a4;font-size:12px}.split{display:grid;grid-template-columns:1fr 300px;gap:18px}.req{padding:22px 24px}.req h2{font-size:16px;margin:0 0 5px}.req p{font-size:12px;color:#7a8aa0;margin:0}.branch{margin:20px 0 0 12px;border-left:1px solid #c8d8ed;padding-left:24px}.branch-item{position:relative;padding:0 0 18px}.branch-item:before{content:'';position:absolute;left:-24px;top:12px;width:17px;border-top:1px solid #c8d8ed}.branch button{width:100%;text-align:left;background:#f8fafd;border:1px solid #e5ecf5;border-radius:8px;padding:13px;color:#324964}.branch button.selected{border-color:#8cb2e7;background:#edf4ff}.branch button strong,.branch button small{display:block}.branch button small{margin-top:4px;color:#75879f}.aside{padding:20px}.aside h3{font-size:14px;margin:0 0 16px}.aside p{font-size:12px;color:#72839a;line-height:1.8}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#263b59;color:white;padding:6px;border-radius:10px;box-shadow:0 8px 24px #20324d30;z-index:3}.switcher span{font-size:12px;color:#d2dceb;padding:0 8px;white-space:nowrap}.switcher button{background:transparent;border:0;color:#d5e0ef;padding:8px 12px;border-radius:6px;white-space:nowrap}.switcher button.on{background:#fff;color:#29466e}.notice{font-size:11px;color:#596b83;margin-top:14px}.hidden{display:none}@media(max-width:800px){.global{width:76px;padding:18px 5px}.brand{font-size:13px;margin-left:5px}.nav{font-size:12px;padding:9px 4px}.caption{font-size:11px}.wrap{padding:20px 16px 110px}.workspace,.split,.columns{grid-template-columns:1fr}.chain{overflow-x:auto}.step{min-width:155px}.switcher span{display:none}.switcher button{font-size:12px;padding:8px}.top .right{display:none}}
</style></head><body><div class="shell"><aside class="global"><div class="brand"><b>MTX</b> &nbsp;工作台</div><div class="caption">工作管理</div><div class="nav">▦ &nbsp;迭代</div><div class="nav active">▤ &nbsp;需求</div><div class="caption">质量管理</div><div class="nav">☑ &nbsp;测试</div><div class="nav">♧ &nbsp;Bug 列表</div><div class="caption">集成</div><div class="nav">▣ &nbsp;基础服务</div></aside><main class="main"><header class="top">当前项目 <strong>Zata-Platform</strong> / 当前迭代 <strong>v1.2.0</strong><span class="right">测试阶段　需求、想法和问题</span></header><div class="wrap"><div class="crumb">需求列表　/　需求详情</div><div class="titleline"><div><h1>【数据处理管线】视频作业记录适配一对多切片逻辑</h1><p>当前需求 · 所有分析和测试产物均归属于此需求</p></div><span class="tag">需求</span></div><div id="app"></div><div class="notice">交互原型 · 示例数据，仅用于比较导航方式，不会修改真实需求或用例。</div></div></main></div><nav class="switcher" aria-label="切换演示方案"><span>对比方案</span><button data-variant="a">A 需求目录</button><button data-variant="b">B 生成流程</button><button data-variant="c">C 需求档案</button></nav><script>
const app=document.querySelector('#app');let variant=new URLSearchParams(location.search).get('variant')||'a', selection='完整用例';const cases=[['切片成功','一条视频作业记录生成多个切片'],['边界条件','切片数量为 1 时保持原有处理逻辑'],['异常处理','切片生成失败时记录错误信息'],['数据一致性','各切片与原视频作业记录正确关联']];function details(){return `<div class="detail"><h2>${selection}</h2><p class="desc">所属需求：视频作业记录适配一对多切片逻辑　/　功能测试</p>${selection==='完整用例'?`<div class="summary"><div><strong>97 条候选用例</strong> <span class="status">待审核</span><div class="small">由测试点生成 · 当前版本 v5</div></div><button class="btn primary" onclick="this.textContent='演示：打开候选用例'">查看全部用例</button></div>${cases.map((x,i)=>`<div class="case"><span class="no">0${i+1}</span><div><strong>${x[1]}</strong><p>${x[0]} · 功能测试</p></div><span class="tag">候选</span></div>`).join('')}`:`<div class="summary"><div><strong>${selection}</strong><div class="small">此需求关联的阶段产物</div></div><span class="tag">示例内容</span></div><p class="small">选择“完整用例”，查看此需求下模型生成的候选用例。</p>`}</div>`}function choose(name){selection=name;render()}function tree(){return `<div class="panel"><div class="panelhead">当前需求的产物</div><div class="tree"><button class="treebutton" onclick="choose('需求材料')">▤　需求材料</button><button class="treebutton" onclick="choose('需求分析')">⌄　需求分析 <span class="count">已通过</span></button><button class="treebutton indent" onclick="choose('需求理解')">需求理解</button><button class="treebutton" onclick="choose('功能测试')">⌄　功能测试</button><button class="treebutton indent" onclick="choose('测试需求分析')">测试需求分析</button><button class="treebutton indent" onclick="choose('测试点')">测试点 <span class="count">8 类</span></button><button class="treebutton indent ${selection==='完整用例'?'selected':''}" onclick="choose('完整用例')">完整用例 <span class="count">97</span></button><button class="treebutton indent" onclick="choose('用例图谱')">用例图谱</button><button class="treebutton" onclick="choose('API 测试')">›　API 测试 <span class="count">未开始</span></button><button class="treebutton" onclick="choose('UI 测试')">›　UI 测试 <span class="count">未开始</span></button><button class="treebutton" onclick="choose('代码风险分析')">›　代码风险分析</button></div></div>`}function a(){return `<p class="intro"><strong>方案 A · 需求目录</strong>　用层级目录直接呈现当前需求的全部产物。</p><div class="workspace">${tree()}<div class="panel">${details()}</div></div>`}function b(){let steps=[['需求材料','原始文档'],['需求分析','已通过'],['测试点','8 个分类 · 已通过'],['完整用例','97 条 · 待审核'],['用例图谱','关联关系']];return `<p class="intro"><strong>方案 B · 生成流程</strong>　把从需求到用例的过程横向展开，当前阶段与下一步一目了然。</p><div class="chain">${steps.map((s,i)=>`<button class="step ${selection===s[0]?'selected':''}" onclick="choose('${s[0]}')"><b>${i+1}. ${s[0]}</b><small>${s[1]}</small></button>`).join('')}</div><div class="panel">${details()}</div><div class="columns" style="margin-top:18px"><div class="panel"><div class="panelhead">其他测试方向</div><div class="plainlist"><div class="row"><span class="dot amber"></span>API 测试<span class="meta">未开始</span></div><div class="row"><span class="dot amber"></span>UI 测试<span class="meta">未开始</span></div></div></div><div class="panel"><div class="panelhead">独立分析</div><div class="plainlist"><div class="row"><span class="dot"></span>代码风险分析<span class="meta">查看分析记录</span></div></div></div></div>`}function c(){return `<p class="intro"><strong>方案 C · 需求档案</strong>　以需求为中心聚合产物，先看有哪些结果，再进入对应内容。</p><div class="split"><div class="panel req"><h2>这个需求的测试产物</h2><p>从需求出发，按测试方向查看分析与生成结果</p><div class="branch"><div class="branch-item"><button onclick="choose('需求理解')" class="${selection==='需求理解'?'selected':''}"><strong>需求分析　<span class="tag">已通过</span></strong><small>需求理解 · 8 个模块</small></button></div><div class="branch-item"><button onclick="choose('完整用例')" class="${selection==='完整用例'?'selected':''}"><strong>功能测试　<span class="status">待审核</span></strong><small>测试点 8 类　→　模型生成候选用例 97 条　→　用例图谱</small></button></div><div class="branch-item"><button onclick="choose('API 测试')"><strong>API 测试</strong><small>尚未开始</small></button></div><div class="branch-item"><button onclick="choose('UI 测试')"><strong>UI 测试</strong><small>尚未开始</small></button></div><div class="branch-item"><button onclick="choose('代码风险分析')"><strong>代码风险分析</strong><small>独立分析链</small></button></div></div></div><div class="panel aside"><h3>${selection==='完整用例'?'功能测试 · 候选用例':selection}</h3><p>${selection==='完整用例'?'模型依据该需求的测试点生成了 97 条候选用例，当前等待审核。':'这是当前需求关联的产物。选择功能测试可查看生成用例。'}</p>${selection==='完整用例'?cases.slice(0,3).map(x=>`<div class="case"><div><strong>${x[1]}</strong><p>${x[0]}</p></div></div>`).join('')+'<p><button class="btn primary" onclick="this.textContent=\'演示：打开候选用例\'">查看 97 条候选用例</button></p>':''}</div></div>`}function render(){app.innerHTML=variant==='a'?a():variant==='b'?b():c();document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('on',b.dataset.variant===variant))}document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;selection='完整用例';history.replaceState(null,'','?variant='+variant);render()});document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;let vs=['a','b','c'];variant=vs[(vs.indexOf(variant)+(e.key==='ArrowRight'?1:2))%3];selection='完整用例';history.replaceState(null,'','?variant='+variant);render()});render();
</script></body></html>
