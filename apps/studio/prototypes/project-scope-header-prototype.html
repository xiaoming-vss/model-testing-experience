<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目和迭代选择器 · 顶栏方案</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#334761;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}button,select{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #6796dc;outline-offset:2px}.header{height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;background:#f8fafd;border-bottom:1px solid #d9e4f1}.brand{font-weight:750;display:flex;align-items:center;gap:8px;flex:none;color:#334d70}.logo{height:32px;width:32px;display:grid;place-items:center;border:1px solid #d9e5f4;border-radius:8px;background:#fff;color:#3571bf;font-size:11px;font-weight:800}.scope{display:flex;align-items:center;background:white;border:1px solid #dce6f3;border-radius:8px;min-height:38px;flex:none}.field{display:flex;align-items:center;gap:7px;padding:0 10px;color:#72849a;white-space:nowrap}.field+ .field{border-left:1px solid #e2eaf4}.field label{font-size:11px}.field select{border:0;background:transparent;color:#344e6d;max-width:145px;outline-offset:1px}.nav{display:flex;align-items:center;gap:3px;min-width:0;overflow:auto;scrollbar-width:thin;flex:1}.nav button{border:0;background:transparent;color:#536a85;white-space:nowrap;border-radius:7px;padding:9px 12px}.nav button.active{background:#e9f2ff;color:#3265af;font-weight:700}.right{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}.right button{border:0;background:transparent;color:#61758f}.right .new{background:#ebf3ff;color:#3768a9;border:1px solid #d2e2f8;border-radius:7px;padding:7px 11px}.content{height:calc(100vh - 64px);overflow:hidden}.content img{width:100%;display:block;margin-top:-2.8%;max-width:none}.desc{position:fixed;top:78px;right:18px;background:white;border:1px solid #dce7f4;border-radius:9px;padding:12px 15px;box-shadow:0 5px 18px #263c5c17;max-width:300px;z-index:3}.desc strong{display:block;color:#263e60}.desc span{color:#647b96;font-size:12px}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:6px;background:#293e5d;color:#d9e5f3;border-radius:10px;z-index:4;box-shadow:0 8px 22px #20314d33}.switcher span{padding:0 7px;font-size:12px;white-space:nowrap}.switcher button{border:0;border-radius:6px;padding:8px 11px;color:#d9e5f3;background:transparent;white-space:nowrap}.switcher button.active{background:white;color:#304e75}.note{position:fixed;right:15px;bottom:17px;font-size:11px;background:#fff;color:#677c96;padding:5px 8px;border-radius:6px}.variant-b .scope{border:0;background:#eaf1fa;padding:3px;gap:3px}.variant-b .field{background:white;border:0;border-radius:6px;height:32px}.variant-b .field label{display:none}.variant-c .scope{background:transparent;border:0;gap:4px}.variant-c .field{background:#edf3fb;border:0;border-radius:8px;height:38px;gap:3px}.variant-c .field label{font-size:10px}.variant-c .field select{font-weight:650}.variant-d .header{gap:10px}.variant-d .scope{border:0;background:transparent;gap:1px}.variant-d .field{border:0;padding:0 5px}.variant-d .field label{display:none}.variant-d .field select{font-weight:700}.variant-d .field+.field:before{content:'/';color:#a3b3c7;margin-right:5px}.variant-d .brand{padding-right:13px;border-right:1px solid #dce6f2}.variant-d .nav{border-left:1px solid #dce6f2;padding-left:10px;margin-left:4px}@media(max-width:1100px){.header{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 15px;gap:8px}.nav{order:3;flex-basis:100%}.right{margin-left:auto}.content img{margin-top:-3%}.desc{top:125px}}@media(max-width:650px){.header{gap:6px}.brand span:last-child,.right .new,.right .status{display:none}.field{padding:0 5px;gap:3px}.field select{max-width:100px}.switcher span{display:none}.switcher button{padding:8px 5px;font-size:12px}.desc{max-width:230px}.note{display:none}}
</style></head><body><div id="app"></div><nav class="switcher" aria-label="切换顶栏方案"><span>顶栏方案</span><button data-v="a">A 一体选择器</button><button data-v="b">B 双胶囊</button><button data-v="c">C 上下标签</button><button data-v="d">D 面包屑</button></nav><div class="note">页面内容为现有截图，仅演示顶部</div><script>
let variant=new URLSearchParams(location.search).get('variant')||'a';let project='Zata-Platform',sprint='v1.2.0',active='迭代';const variants={a:['一体选择器','项目和迭代放在同一个容器，紧接品牌，延续现有控件习惯。'],b:['双胶囊','项目与迭代分成两个轻量控件，关系清楚且易于点击。'],c:['分块标签','用柔和底色区分两个选择范围，适合需要经常切换的场景。'],d:['面包屑','把项目与迭代收成简洁路径，为导航释放更多空间。']};function render(){document.body.className='variant-'+variant;document.querySelector('#app').innerHTML=`<header class="header"><div class="brand"><span class="logo">MTX</span><span>MTX</span></div><div class="scope"><div class="field"><label for="project">当前项目</label><select id="project" aria-label="当前项目" onchange="project=this.value"><option ${project==='Zata-Platform'?'selected':''}>Zata-Platform</option><option ${project==='示例项目'?'selected':''}>示例项目</option></select></div><div class="field"><label for="sprint">当前迭代</label><select id="sprint" aria-label="当前迭代" onchange="sprint=this.value"><option ${sprint==='v1.2.0'?'selected':''}>v1.2.0</option><option ${sprint==='v1.1.0'?'selected':''}>v1.1.0</option><option ${sprint==='全部迭代'?'selected':''}>全部迭代</option></select></div></div><nav class="nav" aria-label="主导航">${['迭代','需求','测试','Bug列表','基础服务'].map(x=>`<button class="${x===active?'active':''}" onclick="active='${x}';render()">${x}</button>`).join('')}</nav><div class="right"><button class="status" title="需求、想法和问题，请联系 limingjiang.x@gmail.com">测试阶段</button><button class="new">＋ 新建项目</button><button aria-label="主题">☼</button><button aria-label="用户">◯</button></div></header><main class="content"><img src="project-scope-header-reference.png" alt="项目现有迭代页面截图"></main><div class="desc"><strong>${variant.toUpperCase()} · ${variants[variant][0]}</strong><span>${variants[variant][1]}</span></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;history.replaceState(null,'','?variant='+variant);render()});render();
</script></body></html>
