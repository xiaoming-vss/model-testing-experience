<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全局导航方案演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#25364e;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #80a8df;outline-offset:2px}.shell{min-height:100vh;display:flex}.side{width:224px;background:#f5f8fc;border-right:1px solid #dce6f1;flex:none;padding:0 12px}.brand{height:57px;display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:750;font-size:17px}.logo{background:white;border:1px solid #dce6f1;border-radius:8px;color:#356bbd;padding:5px;font-size:13px}.label{color:#677a94;font-size:11px;margin:23px 9px 8px}.item{border:0;background:transparent;color:#526780;text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px}.item:hover,.item.sel{background:#e6f0fe;color:#285fae}.item.sel{font-weight:700}.item .arrow{margin-left:auto;color:#7e90a8}.sub{padding-left:22px}.sub .item{font-size:13px;padding:8px 10px}.sub .item:before{content:'';width:5px;height:5px;border-radius:50%;background:#9ab5d7}.sub .item.sel:before{background:#3c72c5}.content{flex:1;min-width:0}.top{height:57px;border-bottom:1px solid #dce6f1;display:flex;align-items:center;padding:0 27px;color:#6b7c93;background:#f8fafd}.top strong{color:#334c69;margin:0 14px}.top .right{margin-left:auto;color:#386bb4;font-size:12px}.page{padding:28px 36px;max-width:1450px}.crumb{font-size:12px;color:#687b94}.title{display:flex;align-items:center;justify-content:space-between;margin:17px 0 22px}.title h1{font-size:22px;margin:0}.button{padding:8px 13px;border:1px solid #d5e2f2;border-radius:7px;background:#eff5ff;color:#3565a7}.panel{background:#fff;border:1px solid #dee7f2;border-radius:9px}.toolbar{padding:18px 20px;border-bottom:1px solid #edf1f6;color:#526981;display:flex;gap:12px;align-items:center}.toolbar strong{color:#2b405c}.toolbar span:last-child{margin-left:auto;color:#7588a1;font-size:12px}.row{padding:18px 20px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;gap:16px}.row:last-child{border:0}.row .text{flex:1}.row strong{display:block;font-size:14px;color:#325f9e}.row small{display:block;color:#75869b;margin-top:5px}.badge{font-size:12px;background:#edf5ff;color:#3467af;border-radius:5px;padding:5px 8px;white-space:nowrap}.badge.warn{background:#fff4df;color:#95631e}.rail{width:76px;background:#eef3fa;border-right:1px solid #dce6f1;flex:none;text-align:center;padding:14px 7px}.rail .logo{display:inline-block}.rail button{display:block;width:100%;border:0;background:transparent;color:#61748f;padding:13px 2px;margin-top:8px;border-radius:8px;font-size:12px}.rail button.active{background:#dfebfb;color:#275fae;font-weight:700}.rail button b{display:block;font-size:20px;margin-bottom:2px}.context{width:220px;background:#f8fafd;border-right:1px solid #dce6f1;flex:none;padding:16px 12px}.context h2{font-size:15px;margin:7px 9px 5px}.context p{font-size:12px;color:#74869c;margin:0 9px 17px}.section{margin-top:18px;border-top:1px solid #e5ebf3;padding-top:10px}.group-title{font-size:12px;color:#70829a;margin:5px 10px}.description{margin:0 0 20px;color:#647a94;line-height:1.7}.description strong{color:#2d4565}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:#263b59;color:#d5e1f0;border-radius:10px;padding:6px;box-shadow:0 8px 22px #20324d35;z-index:3}.switcher span{font-size:12px;padding:0 8px;white-space:nowrap}.switcher button{background:transparent;border:0;color:#d5e1f0;border-radius:6px;padding:8px 11px;white-space:nowrap}.switcher button.on{background:#fff;color:#29466e}.demo{position:fixed;right:16px;bottom:18px;font-size:11px;color:#637992}.fly{margin:0 0 4px 12px;border-left:1px solid #cfdeef;padding-left:8px}@media(max-width:760px){.side{width:185px}.rail{width:64px}.context{width:170px}.page{padding:22px 16px}.top .right{display:none}.switcher span{display:none}.switcher button{font-size:12px;padding:8px 5px}.demo{display:none}}
</style></head><body><div id="app"></div><nav class="switcher" aria-label="切换全局导航方案"><span>全局导航方案</span><button data-v="a">A 展开式</button><button data-v="b">B 双层导航</button><button data-v="c">C 工作流分组</button></nav><div class="demo">演示原型 · 示例数据</div><script>
let variant=new URLSearchParams(location.search).get('variant')||'a',current='需求',open=true;const app=document.querySelector('#app');const list=['需求','需求分析','功能用例生成','API 测试生成','UI 测试生成','代码风险分析'];function select(x){current=x;render()}function item(x,indent=false){return `<button class="item ${current===x?'sel':''}" onclick="select('${x}')">${indent?'':'<span>◈</span>'}${x}</button>`}function primary(){return `<div class="label">工作管理</div>${item('迭代')}${item('需求')}<div class="label">质量管理</div>${item('测试')}${item('Bug 列表')}<div class="label">集成</div>${item('基础服务')}`}function a(){return `<aside class="side"><div class="brand"><span class="logo">MTX</span> MTX</div><div class="label">工作管理</div>${item('迭代')}<button class="item ${list.includes(current)?'sel':''}" onclick="open=!open;render()"><span>◈</span>需求 <span class="arrow">${open?'⌃':'⌄'}</span></button>${open?`<div class="sub">${list.slice(1).map(x=>item(x,true)).join('')}</div>`:''}<div class="label">质量管理</div>${item('测试')}${item('Bug 列表')}<div class="label">集成</div>${item('基础服务')}</aside>`}function b(){return `<aside class="rail"><span class="logo">MTX</span><button onclick="select('迭代')"><b>▦</b>迭代</button><button class="active" onclick="select('需求')"><b>▤</b>需求</button><button onclick="select('测试')"><b>☑</b>测试</button><button onclick="select('Bug 列表')"><b>◇</b>Bug</button><button onclick="select('基础服务')"><b>▣</b>集成</button></aside><aside class="context"><h2>需求工作台</h2><p>需求及其测试设计</p>${item('需求')}<div class="section"><div class="group-title">模型生成</div>${list.slice(1).map(x=>item(x)).join('')}</div></aside>`}function c(){return `<aside class="side"><div class="brand"><span class="logo">MTX</span> MTX</div><div class="label">规划</div>${item('迭代')}${item('需求')}<div class="label">需求驱动 · 模型生成</div>${item('需求分析')}${item('功能用例生成')}${item('API 测试生成')}${item('UI 测试生成')}${item('代码风险分析')}<div class="label">测试执行与管理</div>${item('测试')}${item('Bug 列表')}<div class="label">集成</div>${item('基础服务')}</aside>`}function body(){let generated=list.includes(current)&&current!=='需求';let title=generated?current:current==='需求'?'需求列表':current;return `<main class="content"><header class="top">当前项目 <strong>Zata-Platform</strong> / 当前迭代 <strong>v1.2.0</strong><span class="right">测试阶段　需求、想法和问题</span></header><div class="page"><div class="crumb">${generated?'需求工作台 / 模型生成':'工作管理'} / ${title}</div><div class="title"><h1>${title}</h1><button class="button">${generated?'新建生成任务':'新建需求'}</button></div><p class="description">${variant==='a'?'<strong>方案 A · 展开式</strong>：在“需求”下展开模型生成入口，直接表达上下级关系。':variant==='b'?'<strong>方案 B · 双层导航</strong>：左侧保留一级模块，选中需求后，在旁边展示需求与模型生成的完整导航。':'<strong>方案 C · 工作流分组</strong>：一级导航按规划、模型生成和测试管理分组，所有生成入口常驻可见。'}</p><div class="panel"><div class="toolbar"><strong>${generated?'生成任务':'当前迭代需求'}</strong><span>示例内容，用于观察全局导航</span><span>全部状态　⌄</span></div><div class="row"><div class="text"><strong>【数据处理管线】视频作业记录适配一对多切片逻辑</strong><small>${generated?'关联需求 · 视频作业记录适配一对多切片逻辑':'需求 · 关联功能用例生成、API 测试生成'}</small></div><span class="badge warn">${generated?'待审核':'进行中'}</span></div><div class="row"><div class="text"><strong>【任务管理】支持批量处理视频任务</strong><small>${generated?'关联需求 · 支持批量处理视频任务':'需求 · 关联需求分析、功能用例生成'}</small></div><span class="badge">${generated?'已完成':'进行中'}</span></div><div class="row"><div class="text"><strong>【权限管理】项目成员角色设置</strong><small>${generated?'关联需求 · 项目成员角色设置':'需求 · 尚未开始模型生成'}</small></div><span class="badge">未开始</span></div></div></div></main>`}function render(){app.innerHTML=`<div class="shell">${variant==='a'?a():variant==='b'?b():c()}${body()}</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===variant))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;current='需求';open=true;history.replaceState(null,'','?variant='+variant);render()});render();
</script></body></html>
