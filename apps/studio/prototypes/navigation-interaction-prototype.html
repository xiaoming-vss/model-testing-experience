<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTX 全局导航交互探索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#24364f;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #82a9e5;outline-offset:2px}.top{height:62px;display:flex;align-items:center;gap:20px;padding:0 30px;background:#fff;border-bottom:1px solid #e0e8f2}.logo{font-weight:800;color:#3467b1;font-size:18px}.scope{padding:8px 12px;border:1px solid #dde7f3;border-radius:8px;color:#536b89;font-size:12px}.topnav{display:flex;align-self:stretch;gap:3px;margin-left:18px}.topnav button{position:relative;border:0;background:transparent;color:#61748d;padding:0 16px}.topnav button.active{color:#265ea9;font-weight:700}.topnav button.active:after{content:'';position:absolute;bottom:0;left:15px;right:15px;height:3px;background:#4c7bc4;border-radius:4px}.topright{margin-left:auto;color:#657c99;font-size:12px}.page{max-width:1360px;margin:auto;padding:32px 38px 130px}.crumb{color:#71839a;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.heading h1{margin:0;font-size:23px}.btn{padding:9px 14px;border:1px solid #d4e2f5;border-radius:7px;background:#eaf2ff;color:#3264a8}.desc{color:#667c97;margin:0 0 22px}.desc strong{color:#2c4565}.subnav{display:flex;gap:6px;padding:7px;background:#edf2f9;border-radius:9px;width:max-content;margin-bottom:15px}.subnav button{border:0;background:transparent;padding:8px 15px;border-radius:6px;color:#5c718d}.subnav button.active{background:#fff;color:#2b60a8;font-weight:700;box-shadow:0 1px 3px #304d7020}.panel{background:#fff;border:1px solid #e1e9f3;border-radius:10px}.toolbar{padding:18px 20px;border-bottom:1px solid #ecf1f6;display:flex;gap:15px;align-items:center}.toolbar span{margin-left:auto;color:#71839a;font-size:12px}.row{padding:20px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;gap:15px}.row:last-child{border:0}.row div{flex:1}.row strong{display:block;color:#3566a8}.row small{display:block;color:#71849d;margin-top:6px}.badge{padding:5px 9px;border-radius:6px;background:#fff3df;color:#8b5c1b;font-size:12px}.dock{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:#fff;border:1px solid #dce6f2;border-radius:13px;box-shadow:0 8px 28px #253e601c;z-index:2}.dock button{padding:9px 15px;border:0;background:transparent;color:#647994;border-radius:8px;white-space:nowrap}.dock button.active{background:#e9f2ff;color:#2e65b1;font-weight:700}.dockpanel{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);width:min(620px,90vw);background:#fff;border:1px solid #dce6f2;border-radius:12px;box-shadow:0 12px 30px #263b5924;padding:20px;z-index:2}.dockpanel h3{margin:0 0 4px}.dockpanel p{margin:0 0 15px;color:#70839a;font-size:12px}.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.links button{border:1px solid #e4ebf4;background:#f8fafd;color:#415b7a;border-radius:7px;text-align:left;padding:12px}.links button:hover{background:#eaf2ff}.launch{border:1px solid #d8e5f5;background:#eef5ff;color:#315e9f;border-radius:8px;padding:9px 13px}.shade{position:fixed;inset:62px 0 0;background:#20334d42;z-index:2;display:flex;justify-content:center;align-items:flex-start;padding:60px 20px}.launcher{width:min(780px,100%);background:white;border-radius:14px;box-shadow:0 20px 55px #24385230;padding:25px}.launcher-head{display:flex;justify-content:space-between;align-items:start}.launcher h2{margin:0;font-size:19px}.launcher p{margin:5px 0 20px;color:#71839a}.close{border:0;background:#f0f4fa;border-radius:6px;padding:6px 10px;color:#536982}.launchgroups{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.launchgroups h3{font-size:12px;color:#6d8098;margin:0 0 8px}.launchgroups button{display:block;border:0;border-radius:7px;background:transparent;text-align:left;width:100%;padding:10px;color:#324b6b}.launchgroups button:hover{background:#eef4fd}.launchgroups small{display:block;color:#7789a0;margin-top:2px}.switcher{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:10px;color:#d8e3f2;background:#293d59;z-index:4}.switcher span{font-size:12px;padding:0 8px;white-space:nowrap}.switcher button{background:transparent;border:0;color:#d8e3f2;border-radius:6px;padding:8px 11px;white-space:nowrap}.switcher button.active{background:white;color:#29466e}.hint{font-size:12px;color:#71839a;margin-top:15px}@media(max-width:800px){.top{padding:0 14px;gap:8px}.topnav{gap:0;margin-left:0;overflow:auto}.topnav button{padding:0 8px;white-space:nowrap}.topright{display:none}.scope{display:none}.page{padding:25px 15px 145px}.switcher span{display:none}.switcher button{font-size:12px;padding:8px 6px}.dock button{padding:9px 8px}.launchgroups{grid-template-columns:1fr 1fr}.links{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><nav class="switcher" aria-label="切换交互方案"><span>交互方案</span><button data-v="a">A 顶部导航</button><button data-v="b">B 悬浮导航</button><button data-v="c">C 工作台入口</button></nav><script>
let v=new URLSearchParams(location.search).get('variant')||'a',current='需求',sub='需求列表',show=false;const topitems=['迭代','需求','测试','Bug 列表','基础服务'];const subs=['需求列表','需求分析','功能用例生成','API 测试生成','UI 测试生成','代码风险'];function choose(x){current=x;sub=x==='需求'?'需求列表':x;show=false;render()}function chooseSub(x){current='需求';sub=x;show=false;render()}function headerMarkup(){return `<header class="top"><div class="logo">MTX</div><div class="scope">Zata-Platform　/　v1.2.0　⌄</div>${v==='a'?`<nav class="topnav">${topitems.map(x=>`<button class="${current===x?'active':''}" onclick="choose('${x}')">${x}</button>`).join('')}</nav>`:''}${v==='c'?`<button class="launch" onclick="show=!show;render()">▦　打开工作台</button>`:''}<div class="topright">测试阶段　·　当前项目</div></header>`}function main(){let d=v==='a'?'一级功能放在顶部；进入需求后，在页面顶部切换需求与模型生成。':v==='b'?'常用模块收进底部悬浮导航；点击“需求”弹出其相关入口。':'通过顶部“打开工作台”进入功能入口；选择后回到完整工作区域。';return `<main class="page"><div class="crumb">Zata-Platform / ${current} / ${sub}</div><div class="heading"><h1>${sub}</h1><button class="btn">${sub==='需求列表'?'新建需求':'新建任务'}</button></div><p class="desc"><strong>方案 ${v.toUpperCase()}</strong>　${d}</p>${v==='a'&&current==='需求'?`<nav class="subnav">${subs.map(x=>`<button class="${sub===x?'active':''}" onclick="chooseSub('${x}')">${x}</button>`).join('')}</nav>`:''}<div class="panel"><div class="toolbar"><strong>${sub}</strong><span>当前迭代　⌄</span></div><div class="row"><div><strong>【数据处理管线】视频作业记录适配一对多切片逻辑</strong><small>需求 · 关联需求分析、功能用例生成</small></div><span class="badge">待审核</span></div><div class="row"><div><strong>【任务管理】支持批量处理视频任务</strong><small>需求 · 关联功能用例生成</small></div><span class="badge">进行中</span></div><div class="row"><div><strong>【权限管理】项目成员角色设置</strong><small>需求 · 模型生成尚未开始</small></div><span class="badge">未开始</span></div></div><p class="hint">示例页面：重点体验导航展开、切换和收起，数据仅用于演示。</p></main>`}function dock(){return `${show?`<div class="dockpanel"><h3>需求工作台</h3><p>从需求进入分析与模型生成</p><div class="links">${subs.map(x=>`<button onclick="chooseSub('${x}')">${x}</button>`).join('')}</div></div>`:''}<nav class="dock">${topitems.map(x=>`<button class="${current===x?'active':''}" onclick="${x==='需求'?"show=!show;current='需求';render()":`choose('${x}')`}">${x}</button>`).join('')}</nav>`}function launcher(){return show?`<div class="shade" onclick="show=false;render()"><div class="launcher" onclick="event.stopPropagation()"><div class="launcher-head"><div><h2>打开工作台</h2><p>选择要进入的工作区域</p></div><button class="close" onclick="show=false;render()">关闭 ✕</button></div><div class="launchgroups"><div><h3>工作管理</h3><button onclick="choose('迭代')">迭代<small>规划和跟踪工作</small></button><button onclick="chooseSub('需求列表')">需求<small>查看当前迭代需求</small></button></div><div><h3>需求与模型生成</h3>${subs.slice(1).map(x=>`<button onclick="chooseSub('${x}')">${x}</button>`).join('')}</div><div><h3>质量与集成</h3>${['测试','Bug 列表','基础服务'].map(x=>`<button onclick="choose('${x}')">${x}</button>`).join('')}</div></div></div></div>`:''}function render(){document.querySelector('#app').innerHTML=headerMarkup()+main()+(v==='b'?dock():'')+(v==='c'?launcher():'');document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;current='需求';sub='需求列表';show=v==='b'||v==='c';history.replaceState(null,'','?variant='+v);render()});render();
</script></body></html>
