<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求流程 · 创意方案预览</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--surface:#161b22;--raised:#1c2128;--subtle:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--amber:#ffa657;--blue-soft:rgba(56,139,253,.15);--green-soft:rgba(46,160,67,.15);--amber-soft:rgba(219,109,40,.15)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.appbar{height:52px;display:flex;align-items:center;padding:0 22px;gap:14px;border-bottom:1px solid var(--border)}.logo{width:30px;height:30px;border-radius:8px;background:#f0f6fc;color:#1f6feb;display:grid;place-items:center;font-weight:800}.project{padding:7px 12px;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px}.project strong{color:var(--text);font-weight:500}.topright{margin-left:auto;font-size:11px;color:var(--muted)}.topright em{color:var(--blue);font-style:normal}.shell{display:flex;height:calc(100dvh - 52px)}.nav{width:66px;flex:none;border-right:1px solid var(--border);padding:14px 5px}.nav div{height:53px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:var(--muted);font-size:10px}.nav svg{width:18px;height:18px;stroke:#79a5d6}.nav .active{color:var(--blue);background:var(--raised);border-radius:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px 48px}.head{display:flex;align-items:center;gap:12px;padding:0 8px 13px;border-bottom:1px solid var(--border)}.back{color:var(--muted);font-size:20px}h1{font-size:15px;margin:0;font-weight:650}.label{border-radius:20px;border:1px solid #315681;background:var(--blue-soft);color:var(--blue);font-size:10px;padding:2px 8px}.actions{display:flex;gap:8px;margin-left:auto}.subtle{border:1px solid var(--border);background:var(--raised);border-radius:6px;padding:6px 11px;font-size:11px}.toolbar{display:flex;align-items:center;gap:14px;padding:14px 2px}.tabs{display:flex;gap:3px}.tabs button{border:0;border-radius:6px;background:none;color:var(--muted);font-size:11px;padding:6px 10px}.tabs button.active{background:var(--blue-soft);color:var(--blue)}.toolbar .meta{margin-left:auto;color:var(--muted);font-size:11px}.workspace{min-height:0;flex:1;display:flex;gap:12px}.visual{position:relative;min-width:0;flex:1;border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--bg)}.side{width:252px;flex:none;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:auto}.side-head{padding:19px 18px;border-bottom:1px solid var(--border)}.side-head .over{color:var(--muted);font-size:10px}.side-head h2{font-size:16px;margin:8px 0 6px}.state{font-size:10px;color:var(--green)}.state.pending{color:var(--amber)}.state.idle{color:var(--muted)}.side-content{padding:17px 18px}.side-content p{color:var(--muted);margin:0 0 14px}.side-content dl{border-block:1px solid var(--border);margin:0 0 16px;padding:8px 0}.side-content dl div{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.side-content dt{color:var(--muted)}.side-content dd{margin:0}.side-content h3{font-size:11px;margin:20px 0 9px}.primary{width:100%;background:#238636;border:1px solid #2ea043;border-radius:6px;padding:9px}.version{display:inline-block;border:1px solid #315681;border-radius:5px;color:var(--blue);background:var(--blue-soft);padding:4px 9px;font-size:11px}.helper{font-size:11px;color:var(--muted);padding-top:16px;margin-top:20px;border-top:1px solid var(--border);line-height:1.8}.scene-note{position:absolute;top:24px;left:28px;font-size:11px;color:var(--muted);z-index:2}.scene-note strong{color:var(--text);display:block;font-size:15px;font-weight:600;margin-bottom:5px}.dot{display:inline-block;width:6px;height:6px;flex:none;background:var(--green);border-radius:50%}.dot.pending{background:var(--amber)}.dot.idle{background:var(--muted)}.switcher{position:fixed;z-index:100;left:50%;bottom:13px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#e6edf3;padding:5px;border-radius:9px;box-shadow:0 8px 32px #0009}.switcher span{font-size:10px;color:#57606a;padding:0 7px}.switcher button{background:none;border:0;color:#57606a;border-radius:5px;font-size:11px;padding:7px 11px}.switcher button.active{background:#0d1117;color:#fff}.switcher button:hover:not(.active){background:#d0d7de}.toast{position:fixed;z-index:101;top:64px;left:50%;transform:translateX(-50%);background:var(--subtle);border:1px solid var(--border);padding:9px 15px;border-radius:7px}.mini-info{display:none}.small-btn{border:1px solid var(--border);background:var(--raised);border-radius:5px;color:var(--muted);padding:5px 8px;font-size:10px}.stage{border:1px solid var(--border);background:var(--surface);border-radius:7px;text-align:left}.stage:hover{border-color:var(--blue)}.stage.selected{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}.stage.dim,.group.dim{opacity:.23}.stage-name{font-weight:600;font-size:12px}.stage-sub{font-size:10px;color:var(--muted)}
/* A: a hub with the three downstream paths organised around it. */
.orbit{min-width:980px;min-height:685px;height:100%;position:relative;background-image:radial-gradient(var(--border) .7px,transparent .8px);background-size:22px 22px}.orbit-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.orbit-lines path{stroke:var(--blue);stroke-width:1.2;fill:none;opacity:.6}.orbit-lines circle{fill:var(--blue)}.hub{position:absolute;left:31%;top:35%;width:182px;height:182px;border:1px solid #3e5f82;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 18px rgba(56,139,253,.035),0 0 0 36px rgba(56,139,253,.025)}.hub .hub-small{font-size:10px;color:var(--blue)}.hub strong{font-size:16px;margin:6px}.hub .hub-meta{font-size:11px;color:var(--muted)}.hub .hub-actions{display:flex;gap:5px;margin-top:13px}.hub-actions button{padding:4px 8px;background:var(--blue-soft);border:1px solid #315681;border-radius:5px;font-size:10px;color:var(--blue)}.satellite{position:absolute;width:275px}.satellite .cap{display:flex;align-items:center;gap:7px;font-weight:650;margin-bottom:8px}.cap .count{margin-left:auto;color:var(--muted);font-size:10px;font-weight:400}.satellite .stage{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;margin-top:6px}.satellite .stage .stage-name{flex:1}.satellite .stage .stage-sub{white-space:nowrap}.orbit .source{left:5%;top:39%}.orbit .functional{left:66%;top:12%}.orbit .api{left:69%;top:43%}.orbit .ui{left:66%;top:65%}.orbit .risk{left:5%;top:75%;width:230px}.satellite .compact .stage{padding:9px 11px}.source .stage,.risk .stage{min-height:52px}.orbit-key{position:absolute;bottom:25px;left:28px;color:var(--muted);font-size:10px}.orbit-key span{color:var(--blue);margin-right:5px}
/* B: no surrounding group boxes; the path itself carries hierarchy. */
.rails{min-width:1050px;min-height:680px;height:100%;padding:96px 36px 38px;background:linear-gradient(var(--bg),var(--bg))}.rail-intro{display:flex;align-items:center;gap:16px;margin-bottom:38px}.source-tile{width:160px;flex:none;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.source-tile .tag{font-size:10px;color:var(--muted)}.source-tile strong{display:block;margin-top:5px;font-size:12px}.pathline{height:1px;background:var(--blue);opacity:.6;flex:1}.understanding{display:flex;align-items:center;gap:8px}.micro{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:11px 13px;text-align:left;min-width:125px}.micro strong{display:block;font-size:11px}.micro small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.micro.selected{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}.rails-list{border-top:1px solid var(--border)}.track{display:grid;grid-template-columns:155px 1fr 95px;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid var(--border)}.track-label{display:flex;gap:11px;align-items:center}.track-label .n{font-size:11px;color:var(--blue);font-variant-numeric:tabular-nums}.track-label strong{display:block;font-size:12px}.track-label small{font-size:10px;color:var(--muted)}.track-stages{display:flex;align-items:center;gap:0}.track .stage{height:52px;min-width:140px;padding:8px 11px;display:flex;align-items:center;gap:9px}.track .stage>span:nth-child(2){flex:1}.track .stage .stage-sub{display:block}.connector{height:1px;width:30px;flex:none;background:var(--blue);opacity:.6}.track-tail{text-align:right;color:var(--muted);font-size:10px}.rail-risk{display:flex;align-items:center;gap:12px;padding-top:22px;color:var(--muted);font-size:11px}.rail-risk .small-btn{color:var(--text)}
/* C: a navigation-first working desk; selecting a section reveals its steps. */
.desk{min-width:800px;min-height:680px;height:100%;display:grid;grid-template-columns:230px minmax(0,1fr);background:var(--surface)}.desk-nav{padding:27px 13px;border-right:1px solid var(--border);background:var(--bg)}.desk-nav .desk-heading{font-size:11px;color:var(--muted);padding:3px 10px 17px}.desk-group{width:100%;display:flex;align-items:center;gap:9px;border:0;border-radius:7px;padding:11px 10px;margin-bottom:4px;background:transparent;text-align:left}.desk-group:hover{background:var(--raised)}.desk-group.active{background:var(--blue-soft);color:var(--blue)}.desk-group span:nth-child(2){flex:1}.desk-group small{font-size:10px;color:var(--muted)}.desk-body{padding:35px 42px;min-width:0;background-image:radial-gradient(var(--border) .7px,transparent .8px);background-size:22px 22px}.desk-breadcrumb{font-size:11px;color:var(--muted)}.desk-title{display:flex;align-items:center;gap:12px;margin-top:16px}.desk-title h2{font-size:22px;margin:0}.desk-title .state{margin-left:auto}.desk-summary{color:var(--muted);margin:8px 0 26px}.desk-row{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr);gap:13px}.desk-row:not(:last-child):before{content:"";position:absolute;top:32px;bottom:-9px;left:17px;width:1px;background:var(--border)}.desk-num{display:grid;place-items:center;width:35px;height:35px;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:50%;font-size:10px;color:var(--blue)}.desk-row .stage{padding:13px 15px;margin-bottom:12px;display:flex;align-items:center;gap:12px}.desk-row .stage div{flex:1}.desk-row .stage-sub{display:block;margin-top:4px}.desk-row .stage .state{margin-left:auto}.desk-desc{margin-top:16px;padding:13px 15px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:11px}.scene-a .visual{background:var(--bg)}
@media(max-width:1050px){.nav{display:none}.side{display:none}.mini-info{display:block;position:absolute;top:12px;right:12px;z-index:4;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:10px}.topright,.toolbar .meta,.actions{display:none}.main{padding:10px 10px 45px}.visual{overflow:auto}.orbit,.rails,.desk{transform-origin:top left}.scene-note{top:18px;left:18px}.switcher button{padding:7px}.project{font-size:10px}}

<header class="appbar"><span class="logo">M</span><div class="project">当前项目　/　<strong>Zata-Platform</strong>　 │　 当前迭代　/　<strong>v1.2.0</strong></div><span class="topright"><em>需求流程设计实验</em>　 ·　示例数据 · 不修改平台</span></header><div class="shell"><nav class="nav"><div><svg><use href="#i-grid"/></svg>迭代</div><div class="active"><svg><use href="#i-doc"/></svg>需求</div><div><svg><use href="#i-check"/></svg>测试</div><div><svg><use href="#i-grid"/></svg>Bug列表</div><div><svg><use href="#i-doc"/></svg>基础服务</div></nav><main class="main"><div class="head"><span class="back">‹</span><h1>【Export数据工厂】转换数据</h1><span class="label">需求</span><div class="actions"><button class="subtle preview">下载原文件</button><button class="subtle preview">编辑需求</button></div></div><div class="toolbar"><div class="tabs"><button class="active" data-filter="all">全部 4</button><button data-filter="pending">待审核 1</button><button data-filter="idle">未开始 1</button></div><span class="meta">点击节点查看详情 · 当前为设计预览</span></div><div class="workspace"><section class="visual" id="visual" aria-label="设计方案画布"></section><aside class="side" id="side"></aside></div></main></div><div class="switcher"><span>新方案</span><button data-variant="A">A 路径星图</button><button data-variant="B">B 流程航线</button><button data-variant="C">C 阶段工作台</button></div>
<script>
// Read-only prototype; three alternatives use a snapshot of this requirement's displayed data.
const items={doc:{name:'需求文档',section:'需求文档',summary:'生成链读取最新正文',state:'只读来源',type:'idle'},extract:{name:'提取与整理',section:'需求分析',summary:'7 个字段',version:'v1',state:'已通过'},understand:{name:'需求理解',section:'需求分析',summary:'4 个模块',version:'v1',state:'已通过'},analysis:{name:'测试需求分析',section:'功能测试',summary:'5 个字段',version:'v1',state:'已通过'},points:{name:'测试点',section:'功能测试',summary:'4 个分类',version:'v1',state:'已通过'},cases:{name:'完整用例',section:'功能测试',summary:'68 条用例',version:'v1',state:'已导入'},api:{name:'开始 API 测试',section:'API 测试',summary:'先完成生成设置',state:'未开始',type:'idle'},surface:{name:'元素控件清单',section:'UI 测试',summary:'6 个页面',version:'v2',state:'已通过'},design:{name:'UI 用例设计',section:'UI 测试',summary:'68 条用例',version:'v2',state:'已通过'},yaml:{name:'用例 YAML',section:'UI 测试',summary:'68 条记录',version:'待审核',state:'待审核',type:'pending'},risk:{name:'代码风险分析',section:'代码风险',summary:'独立分析链',state:'独立',type:'idle'}};
const sections={doc:{label:'需求文档',steps:['doc'],note:'生成链读取需求的最新正文。'},analysis:{label:'需求分析',steps:['extract','understand'],note:'从需求材料中提取信息并形成需求理解。'},function:{label:'功能测试',steps:['analysis','points','cases'],note:'从测试需求分析、测试点到完整用例。'},api:{label:'API 测试',steps:['api'],note:'配置生成设置后开始 API 测试。'},ui:{label:'UI 测试',steps:['surface','design','yaml'],note:'从元素控件到 UI 用例与执行 YAML。'},risk:{label:'代码风险',steps:['risk'],note:'独立查看代码风险运行报告。'}};
let selected='yaml',section='ui',filter='all',variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';const visual=document.getElementById('visual');
function state(id){const i=items[id];return i.type||''}function stage(id,format='list'){const i=items[id],dim=(filter==='pending'&&i.type!=='pending'||filter==='idle'&&i.type!=='idle')?' dim':'';return `<button class="stage${selected===id?' selected':''}${dim}" data-node="${id}"><span class="dot ${state(id)}"></span><span class="stage-name">${i.name}</span><span class="stage-sub">${format==='list'?(i.version?i.version+' · ':'')+i.summary:''}</span></button>`}
function side(){let i=items[selected];document.getElementById('side').innerHTML=`<div class="side-head"><div class="over">${i.section} / 阶段详情</div><h2>${i.name}</h2><span class="state ${state(selected)}">● ${i.state}</span></div><div class="side-content"><p>${i.summary}</p><dl><div><dt>所属阶段</dt><dd>${i.section}</dd></div><div><dt>当前版本</dt><dd>${i.version||'—'}</dd></div><div><dt>当前状态</dt><dd>${i.state}</dd></div></dl><button class="primary preview">${i.type==='pending'?'查看并审核':i.type==='idle'?'查看详情':'查看产物'}</button><h3>版本选择</h3><span class="version">${i.version||'当前'}</span><div class="helper">${i.type==='pending'?'待审核操作<br>审核通过 · 审核不通过 · 继续优化':'这里展示当前阶段的版本和可用操作。'}<br><br>交互原型 · 业务按钮仅作展示</div></div>`}
function orbit(){return `<div class="orbit"><div class="scene-note"><strong>以需求为中心</strong>围绕需求分析，展开不同的测试路径</div><svg class="orbit-lines" aria-hidden="true"></svg><div class="satellite source"><div class="cap">需求材料 <span class="count">只读来源</span></div>${stage('doc')}</div><div class="hub"><span class="hub-small">源于需求文档</span><strong>需求分析</strong><span class="hub-meta">7 个字段 · 4 个模块</span><div class="hub-actions"><button data-node="extract">提取与整理</button><button data-node="understand">需求理解</button></div></div><div class="satellite functional"><div class="cap"><span class="dot"></span>功能测试 <span class="count">3 个阶段</span></div>${stage('analysis')}${stage('points')}${stage('cases')}</div><div class="satellite api"><div class="cap"><span class="dot idle"></span>API 测试 <span class="count">未开始</span></div>${stage('api')}</div><div class="satellite ui"><div class="cap"><span class="dot pending"></span>UI 测试 <span class="count">1 个待审核</span></div>${stage('surface')}${stage('design')}${stage('yaml')}</div><div class="satellite risk compact"><div class="cap">独立分析 <span class="count">与流程并列</span></div>${stage('risk')}</div><div class="orbit-key"><span>●</span>需求驱动路径　　·　　节点可选择</div></div>`}
function track(id,n,label,sub,steps,tail){return `<div class="track"><div class="track-label"><span class="n">${n}</span><div><strong>${label}</strong><small>${sub}</small></div></div><div class="track-stages">${steps.map((s,i)=>`${i?'<span class="connector"></span>':''}<button class="stage${selected===s?' selected':''}${(filter==='pending'&&items[s].type!=='pending'||filter==='idle'&&items[s].type!=='idle')?' dim':''}" data-node="${s}"><span class="dot ${state(s)}"></span><span><span class="stage-name">${items[s].name}</span><span class="stage-sub">${items[s].version||'—'} · ${items[s].summary}</span></span></button>`).join('')}</div><span class="track-tail">${tail}</span></div>`}
function rails(){return `<div class="rails"><div class="scene-note"><strong>把阶段放到同一张航线上</strong>用横向轨道代替大容器，路径一眼可扫</div><div class="rail-intro"><button class="source-tile" data-node="doc"><span class="tag">输入材料</span><strong>需求文档　→</strong></button><span class="pathline"></span><div class="understanding"><button class="micro" data-node="extract"><strong>提取与整理</strong><small>v1 · 7 个字段</small></button><button class="micro" data-node="understand"><strong>需求理解</strong><small>v1 · 4 个模块</small></button></div></div><div class="rails-list">${track('function','01','功能测试','需求 → 用例',['analysis','points','cases'],'已通过')}${track('api','02','API 测试','接口生成',['api'],'未开始')}${track('ui','03','UI 测试','控件 → 脚本',['surface','design','yaml'],'1 个待审核')}</div><div class="rail-risk">独立分析 <button class="small-btn" data-node="risk">代码风险分析　↗</button></div></div>`}
function desk(){let s=sections[section];return `<div class="desk"><div class="desk-nav"><div class="desk-heading">需求流程　/　阶段</div>${Object.entries(sections).map(([id,s],idx)=>`<button class="desk-group${section===id?' active':''}" data-section="${id}"><span class="dot ${id==='api'?'idle':id==='ui'?'pending':''}"></span><span>${s.label}</span><small>${String(idx+1).padStart(2,'0')}</small></button>`).join('')}</div><div class="desk-body"><div class="desk-breadcrumb">【Export数据工厂】转换数据 / ${s.label}</div><div class="desk-title"><h2>${s.label}</h2><span class="state ${section==='ui'?'pending':section==='api'?'idle':''}">${section==='ui'?'1 个待审核':section==='api'?'未开始':section==='risk'?'独立分析':'已通过'}</span></div><p class="desk-summary">${s.note}</p><div class="desk-steps">${s.steps.map((id,i)=>`<div class="desk-row"><span class="desk-num">${String(i+1).padStart(2,'0')}</span><button class="stage${selected===id?' selected':''}" data-node="${id}"><span class="dot ${state(id)}"></span><div><strong class="stage-name">${items[id].name}</strong><span class="stage-sub">${items[id].version||'—'} · ${items[id].summary}</span></div><span class="state ${state(id)}">${items[id].state}</span><span>›</span></button></div>`).join('')}</div><div class="desk-desc">选择阶段查看右侧版本与操作；各阶段的产物阅读方式保持原平台体验。</div></div></div>`}
function drawOrbit(){const root=visual.querySelector('.orbit');if(!root)return;const svg=root.querySelector('.orbit-lines'),r=root.getBoundingClientRect(),hub=root.querySelector('.hub').getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.replaceChildren();const point=(el,side)=>{let b=el.getBoundingClientRect();return {x:(side==='right'?b.right:b.left)-r.left,y:b.top+b.height/2-r.top}};const hubLeft={x:hub.left-r.left,y:hub.top+hub.height/2-r.top},hubRight={x:hub.right-r.left,y:hub.top+hub.height/2-r.top};for(const [a,b] of [[point(root.querySelector('.source .stage'),'right'),hubLeft],[hubRight,point(root.querySelector('.functional .stage'),'left')],[hubRight,point(root.querySelector('.api .stage'),'left')],[hubRight,point(root.querySelector('.ui .stage'),'left')]]){let p=document.createElementNS('http://www.w3.org/2000/svg','path'),m=(a.x+b.x)/2;p.setAttribute('d',`M${a.x} ${a.y} C${m} ${a.y} ${m} ${b.y} ${b.x} ${b.y}`);svg.append(p)}}
function toast(){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent='预览模式：业务操作在正式平台中完成';document.body.append(t);setTimeout(()=>t.remove(),2000)}
function render(){document.body.className='scene-'+variant.toLowerCase();visual.innerHTML=variant==='A'?orbit():variant==='B'?rails():desk();let mini=document.createElement('div');mini.className='mini-info';mini.textContent=items[selected].section+' / '+items[selected].name+' · '+items[selected].state;visual.append(mini);side();document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=b.dataset.node;section=Object.keys(sections).find(k=>sections[k].steps.includes(selected))||'ui';render()});document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;selected=sections[section].steps[0];render()});document.querySelectorAll('.preview').forEach(b=>b.onclick=toast);requestAnimationFrame(drawOrbit)}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);visual.scrollTo(0,0);render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});window.addEventListener('resize',drawOrbit);render();
</script></body></html>
