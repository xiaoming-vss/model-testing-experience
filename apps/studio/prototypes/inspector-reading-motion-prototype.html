<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读区与阶段详情联动动效</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#edf2f8;color:#283c57;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #5d92dd;outline-offset:2px}.stage{width:100%;height:100vh;overflow:auto}.frame{position:relative;width:100%;min-width:900px;aspect-ratio:2305/1488;background:#f7f9fd}.reference{display:block;width:100%;height:auto}.hit{position:absolute;left:69.2%;top:18%;width:5.7%;height:5.8%;border:0;background:transparent;border-radius:8px}.hit:hover{background:#fff3}.tip{position:absolute;left:69.2%;top:25%;font-size:12px;color:#315f9f;background:#fff;border:1px solid #dbe7f6;box-shadow:0 3px 10px #2d49671c;border-radius:6px;padding:5px 9px;white-space:nowrap;pointer-events:none}.reader{position:absolute;left:.45%;top:7.6%;width:85.2%;height:91%;border:1px solid #dce7f3;border-radius:10px;background:#fff;overflow:hidden;transform-origin:85% 13%;box-shadow:0 6px 20px #243d5a10}.reader[hidden]{display:none}.reader.enter{animation:grow-in 380ms cubic-bezier(.22,1,.36,1) both}.reader.exit{animation:grow-out 260ms ease-in both}@keyframes grow-in{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}@keyframes grow-out{to{opacity:0;transform:scale(.93)}}.reader-head{height:57px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid #e4ebf4;background:#f8fafd}.reader-head h1{font-size:15px;margin:0}.sub{font-size:12px;color:#7d8da2}.spacer{flex:1}.mode{display:flex;border-radius:7px;padding:3px;background:#e9eff7;gap:3px}.mode span{color:#71849a;padding:5px 12px;border-radius:5px}.mode .active{background:white;color:#3466aa;font-weight:600}.reader-body{height:calc(100% - 57px);overflow:auto;padding:24px 26px}.intro{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #e9eef5;padding-bottom:18px}.intro h2{font-size:18px;margin:0}.intro p{font-size:12px;color:#76889e;margin:5px 0 0}.status{font-size:11px;color:#96601c;background:#fff2db;padding:4px 7px;border-radius:6px;white-space:nowrap}.case{display:grid;grid-template-columns:38px 1fr auto;gap:14px;padding:17px 2px;border-bottom:1px solid #edf1f6;align-items:start}.case .n{color:#93a2b5;font-size:12px}.case strong{font-size:13px}.case p{font-size:12px;color:#788aa1;margin:4px 0 0}.tag{font-size:11px;color:#386ab2;background:#eaf2ff;border-radius:5px;padding:4px 7px}.side{position:absolute;left:86.2%;top:7.6%;width:13.3%;height:91.3%;overflow:hidden;background:#fff;border:1px solid #d9e5f2;border-radius:10px}.side-inner{height:100%;overflow:auto}.side-head{padding:14px 15px;border-bottom:1px solid #e7edf5}.heading{display:flex;align-items:center;gap:6px}.heading h2{margin:0;font-size:14px;flex:1}.side-head p{color:#72859e;font-size:12px;margin:5px 0}.run{font-size:11px;color:#8394aa}.section{margin:0 15px;padding:14px 0;border-bottom:1px solid #edf1f6}.section h3{font-size:12px;margin:0 0 9px}.chip{display:inline-block;border:1px solid #dfe8f3;background:#f5f8fc;color:#637995;border-radius:5px;padding:4px 7px;font-size:11px;margin:0 3px 4px 0}.chip.active{background:#eaf2ff;color:#3063ac;border-color:#b8d1f1}.back{display:block;border:0;background:#edf4ff;color:#3568ad;border-radius:6px;padding:7px 9px;width:100%;text-align:left;margin:0 0 10px}.review{margin:15px;padding:12px;background:#f8fafd;border:1px solid #e6edf6;border-radius:8px}.review strong{display:block;font-size:12px}.review p{font-size:11px;color:#74879d;margin:5px 0 10px}.review button{border:1px solid #d5e4f6;background:#eaf2ff;color:#3164aa;border-radius:6px;padding:7px 8px}.side-inner.enter-a{animation:content-soft 320ms cubic-bezier(.22,1,.36,1) both}.side-inner.enter-b{animation:side-shift 360ms cubic-bezier(.22,1,.36,1) both}.side-inner.enter-c .side-head{animation:content-soft 280ms 80ms both}.side-inner.enter-c .section{animation:content-soft 280ms 150ms both}.side-inner.enter-c .review{animation:content-soft 280ms 220ms both}.side-inner.exit{animation:content-away 220ms ease-in both}@keyframes content-soft{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes side-shift{from{opacity:.55;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}@keyframes content-away{to{opacity:0;transform:translateY(6px)}}.description{position:fixed;right:18px;bottom:82px;z-index:5;background:#fff;border:1px solid #dbe6f3;border-radius:9px;padding:12px 15px;box-shadow:0 5px 18px #2a405b18;width:280px}.description b{display:block;color:#294462}.description span{font-size:12px;color:#6c819a}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;background:#293f5e;color:#d9e4f2;border-radius:10px;padding:6px;box-shadow:0 6px 22px #1c314d30}.switch span{padding:0 8px;font-size:12px;white-space:nowrap}.switch button{border:0;border-radius:6px;background:transparent;color:#d9e4f2;padding:8px 11px;white-space:nowrap}.switch button.active{background:white;color:#2f517c}@media(max-width:900px){.description{width:220px}.switch span{display:none}.switch button{font-size:12px;padding:8px 5px}}@media(prefers-reduced-motion:reduce){.reader,.side-inner,.side-inner *{animation-duration:.001ms!important;animation-delay:0ms!important}}
</style></head><body><main class="stage"><div class="frame"><img class="reference" src="card-open-motion-reference.png" alt="需求生成画布示意"><button class="hit" aria-label="双击打开完整用例" title="双击打开完整用例"></button><div class="tip" id="hint">双击「完整用例」体验联动</div><section class="reader" id="reader" aria-label="完整用例阅读区" hidden><header class="reader-head"><h1>完整用例</h1><span class="sub">功能测试 · 待审核产物</span><span class="spacer"></span><div class="mode"><span class="active">可视化</span><span>原文</span></div></header><div class="reader-body"><div class="intro"><div><h2>测试用例</h2><p>【localserver】支持配置清洗开关　/　功能测试</p></div><span class="status">待审核 · 28 条用例</span></div><div class="case"><span class="n">01</span><div><strong>开启配置后按规则执行清洗</strong><p>正常流程 · 验证配置生效与处理结果</p></div><span class="tag">候选</span></div><div class="case"><span class="n">02</span><div><strong>关闭清洗开关后保留原始数据</strong><p>开关控制 · 验证关闭状态下的处理行为</p></div><span class="tag">候选</span></div><div class="case"><span class="n">03</span><div><strong>修改配置后重新执行任务</strong><p>配置变更 · 验证新配置生效</p></div><span class="tag">候选</span></div></div></section><aside class="side" aria-label="阶段详情"><div class="side-inner" id="side"></div></aside></div></main><aside class="description"><b id="name"></b><span id="summary"></span></aside><nav class="switch" aria-label="切换配套方案"><span>右侧配套动效</span><button data-v="a">A 内容轻换</button><button data-v="b">B 同步靠近</button><button data-v="c">C 轻微错开</button></nav><script>
let variant=new URLSearchParams(location.search).get('variant')||'a',opened=false,timer;const reader=document.querySelector('#reader'),side=document.querySelector('#side'),hint=document.querySelector('#hint'),hit=document.querySelector('.hit');const info={a:['A · 内容轻换','侧栏外框保持稳定，仅在双击时让内部信息轻微上移、淡入。'],b:['B · 同步靠近','侧栏内部从右侧短距离靠近，与左侧阅读区同时进入。'],c:['C · 轻微错开','先进入阅读区，再让侧栏标题、版本和操作依次轻轻出现。']};function label(){document.querySelector('#name').textContent=info[variant][0];document.querySelector('#summary').textContent=info[variant][1];document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant))}function sidebar(reading){return `<header class="side-head">${reading?'<button class="back" id="back">← 返回流程</button>':''}<div class="heading"><h2>完整用例</h2><span class="status">待审核</span>${reading?'':'<span style="color:#8a9ab0">×</span>'}</div><p>功能测试 · 28 条用例</p><span class="run">运行 ID　01af1479…f3da</span></header><section class="section"><h3>版本选择</h3><span class="chip active">待审核</span><span class="chip">v3</span><span class="chip">v2</span></section><section class="section"><h3>上游追溯</h3><span class="chip">测试需求分析 v2</span><span class="chip">测试点 v2</span></section>${reading?'<section class="review"><strong>阶段操作</strong><p>审核当前候选用例</p><button>继续优化</button> <button>审核通过</button></section>':''}`}function updateSide(reading,animate){side.className='side-inner';side.innerHTML=sidebar(reading);if(animate){void side.offsetWidth;side.classList.add('enter-'+variant)}document.querySelector('#back')?.addEventListener('click',closeReader)}function openReader(){clearTimeout(timer);opened=true;reader.hidden=false;hint.hidden=true;hit.hidden=true;reader.className='reader';void reader.offsetWidth;reader.classList.add('enter');updateSide(true,true)}function closeReader(){if(!opened)return;opened=false;reader.className='reader exit';side.className='side-inner exit';const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:260;timer=setTimeout(()=>{reader.hidden=true;reader.className='reader';hit.hidden=false;hint.hidden=false;updateSide(false,true);hit.focus()},duration)}hit.addEventListener('dblclick',openReader);hit.addEventListener('click',e=>{if(e.detail===0)openReader()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;history.replaceState(null,'','?variant='+variant);label();if(opened)openReader()});updateSide(false,false);label();
</script></body></html>
