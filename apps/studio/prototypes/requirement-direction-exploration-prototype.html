function control(){return `<div class="control"><svg class="control-links" aria-hidden="true"></svg><div class="ctrl-head"><span class="overline">REQUIREMENT CONTROL</span><h2>需求生成中心</h2><p>以需求理解为起点，观察不同测试路径。</p></div><div class="ctrl-state"><b>● 需求已就绪</b>当前需求 / v1.2.0</div><div class="ctrl-grid"><div class="ctrl-input"><div class="overline">SOURCE MATERIAL</div><button class="node" data-node="doc">需求文档 →</button><p>生成链读取最新正文</p></div><div class="reactor"><div class="reactor-inner"><span class="overline">REQUIREMENT</span><h3>需求分析</h3><p>7 个字段 / 4 个模块</p><button data-node="extract">提取与整理</button><button data-node="understand">需求理解</button></div></div><div class="ctrl-paths">${['function','api','ui'].map(g=>{let x=groups[g];return `<div class="ctrl-group"><div class="ctrl-group-head"><span class="dot ${g==='api'?'idle':g==='ui'?'pending':''}"></span>${x.title}<small>${x.state}</small></div>${x.steps.map(id=>`<button class="node ctrl-node${cls(id)}" data-node="${id}"><span class="dot ${kind(id)}"></span>${data[id].title}<small>${data[id].version||'—'}</small></button>`).join('')}</div>`}).join('')}</div></div><div class="ctrl-foot"><span>路径状态来自需求当前产物</span><span>独立分析 <button class="node" data-node="risk">代码风险 ↗</button></span></div></div>`}
const boardPositions={doc:[130,270],analysis:[405,230],function:[725,100],api:[725,300],ui:[725,475],risk:[180,540]};const boardGroups=[['doc',['doc']],['analysis',['extract','understand']],['function',['analysis','points','cases']],['api',['api']],['ui',['surface','design','yaml']],['risk',['risk']]];
function board(){return `<div class="board"><div class="board-top"><b>需求画布</b><span class="board-badge">自由拖动分组 · 位置仅在本次预览有效</span></div><div class="tools"><button title="选择">↖</button><button title="画布">✥</button><button title="放大预览" class="demo">＋</button></div><div class="board-canvas"><svg class="board-svg"></svg><div class="board-note">从需求到测试<small>在这块画布上，自由移动和组织各条路径。</small></div>${boardGroups.map(([g,ids])=>`<div class="board-group" data-group="${g}" style="left:${boardPositions[g][0]}px;top:${boardPositions[g][1]}px"><div class="handle"><span class="dot ${g==='api'?'idle':g==='ui'?'pending':''}"></span><b>${groups[g].title}</b><small>${groups[g].state}</small></div>${ids.map(id=>`<button class="node board-stage${cls(id)}" data-node="${id}">${data[id].title}<small>${data[id].version||data[id].status}</small></button>`).join('')}</div>`).join('')}</div><div class="board-footer">拖住分组标题移动 · 点击阶段查看详情</div><div class="board-status">● 预览模式　100%</div></div>`}
function docStage(id,n){let d=data[id];return `<button class="node doc-step${cls(id)}" data-node="${id}"><span class="n">0${n+1}</span><span class="dot ${kind(id)}"></span><span class="name">${d.title}</span><span class="summary">${d.version||'—'} · ${d.desc}</span><span class="status ${kind(id)}">${d.status}</span><span>›</span></button>`}
function documentView(){let g=groups[current];return `<div class="document"><nav class="doc-nav"><div class="doc-nav-title">需求工作区 / 导航</div>${['doc','analysis','function','api','ui','risk'].map(id=>`<button class="doc-link${current===id?' active':''}" data-group-select="${id}"><span class="dot ${id==='api'?'idle':id==='ui'?'pending':''}"></span>${groups[id].title}<small>${groups[id].steps.length} 项</small></button>`).join('')}</nav><div class="doc-content"><div class="doc-breadcrumb">Zata-Platform　/　【Export数据工厂】转换数据</div><h2>${g.title}</h2><div class="doc-intro">${g.note}。在这里阅读各个阶段的产物，并继续已有审核流程。</div><div class="doc-properties"><span>当前状态</span><span>${g.state}</span><span>包含阶段</span><span>${g.steps.length} 个</span><span>项目迭代</span><span>v1.2.0</span></div><hr class="doc-divider"><h3>阶段与产物</h3>${g.steps.map(docStage).join('')}<div class="doc-callout"><strong>继续工作</strong>选择任意阶段，即可在侧栏中查看版本和可用操作。</div></div></div>`}
function drawBoard(){let root=view.querySelector('.board-canvas');if(!root)return;let svg=root.querySelector('svg'),r=root.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.replaceChildren();for(const [a,b] of [['doc','analysis'],['analysis','function'],['analysis','api'],['analysis','ui']]){let x=root.querySelector(`[data-group="${a}"]`).getBoundingClientRect(),y=root.querySelector(`[data-group="${b}"]`).getBoundingClientRect();let ax=x.right-r.left,ay=x.top+x.height/2-r.top,bx=y.left-r.left,by=y.top+y.height/2-r.top,m=(ax+bx)/2;let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${ax} ${ay} C${m} ${ay} ${m} ${by} ${bx} ${by}`);svg.append(p)}}
function drawControl(){let root=view.querySelector('.control');if(!root)return;let svg=root.querySelector('svg'),r=root.getBoundingClientRect(),hub=root.querySelector('.reactor').getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.replaceChildren();const point=(el,side)=>{let b=el.getBoundingClientRect();return{x:(side==='right'?b.right:b.left)-r.left,y:b.top+b.height/2-r.top}};let hl={x:hub.left-r.left,y:hub.top+hub.height/2-r.top},hr={x:hub.right-r.left,y:hub.top+hub.height/2-r.top};let pairs=[[point(root.querySelector('.ctrl-input'),'right'),hl],...Array.from(root.querySelectorAll('.ctrl-group')).map(el=>[hr,point(el,'left')])];for(let [a,b] of pairs){let p=document.createElementNS('http://www.w3.org/2000/svg','path'),mid=(a.x+b.x)/2;p.setAttribute('d',`M${a.x} ${a.y} C${mid} ${a.y} ${mid} ${b.y} ${b.x} ${b.y}`);svg.append(p)}}
function bindDrag(){view.querySelectorAll('.board-group .handle').forEach(handle=>handle.onpointerdown=e=>{let el=handle.parentElement,start={x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top)};handle.setPointerCapture(e.pointerId);handle.onpointermove=m=>{let left=start.left+m.clientX-start.x,top=start.top+m.clientY-start.y;el.style.left=left+'px';el.style.top=top+'px';boardPositions[el.dataset.group]=[left,top];drawBoard()};handle.onpointerup=()=>{handle.onpointermove=null}})}
function toast(){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent='设计预览：此按钮在正式平台中执行';document.body.append(t);setTimeout(()=>t.remove(),2000)}
function render(){view.innerHTML=variant==='A'?minimal():variant==='B'?control():variant==='C'?board():documentView();let d=data[selected],note=document.createElement('div');note.className='mobile-note';note.textContent=d.group+' / '+d.title+' · '+d.status;view.append(note);side();document.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('active',b.dataset.v===variant);b.setAttribute('aria-pressed',b.dataset.v===variant)});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=b.dataset.node;current=Object.keys(groups).find(g=>groups[g].steps.includes(selected))||'ui';render()});document.querySelectorAll('[data-group-select]').forEach(b=>b.onclick=()=>{current=b.dataset.groupSelect;selected=groups[current].steps[0];render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('.demo').forEach(b=>b.onclick=toast);bindDrag();requestAnimationFrame(()=>{drawBoard();drawControl()})}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);view.scrollTo(0,0);render()});window.addEventListener('resize',()=>{drawBoard();drawControl()});render();
</script></body></html>
