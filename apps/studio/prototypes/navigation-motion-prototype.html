<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顶部导航切换动效探索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#304761;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #6795dd;outline-offset:2px}.header{height:64px;display:flex;align-items:center;gap:15px;padding:0 25px;border-bottom:1px solid #dfe8f3;background:#f8fafd}.brand{font-size:14px;font-weight:750;display:flex;align-items:center;gap:8px;flex:none}.logo{width:32px;height:32px;display:grid;place-items:center;border:1px solid #dce7f4;border-radius:8px;background:#fff;color:#3873bf;font-size:10px}.scope{display:flex;gap:7px;align-items:center;white-space:nowrap;color:#93a6be}.scope select{border:0;background:transparent;color:#3d5674;max-width:145px}.nav{position:relative;display:flex;align-self:stretch;align-items:center;gap:3px;flex:1;min-width:0;overflow:auto;scrollbar-width:thin}.nav button{height:44px;position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:0 13px;border:0;border-radius:8px;background:transparent;color:#526a85;white-space:nowrap;transition:color .22s ease,background .22s ease}.nav button.active{color:#3069b9;font-weight:700}.nav button:hover{background:#edf3fb}.icon{height:17px;width:17px;fill:none;stroke:currentColor;stroke-width:1.65;transition:transform .25s ease}.indicator{position:absolute;z-index:0;pointer-events:none;bottom:5px;height:2px;background:#3c75c7;border-radius:2px;transition:left .35s cubic-bezier(.22,1,.36,1),width .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1)}.b .indicator{height:36px;bottom:14px;background:#e6f0ff;border-radius:8px;transition:left .42s cubic-bezier(.2,.8,.2,1),width .42s cubic-bezier(.2,.8,.2,1)}.c .indicator{height:3px;bottom:5px;transition:left .52s cubic-bezier(.18,1.4,.32,1),width .52s cubic-bezier(.18,1.4,.32,1)}.c .nav button.active .icon{transform:translateY(-3px)}.d .indicator{bottom:5px;height:2px;transition:left .32s ease,width .32s ease}.actions{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}.actions button{border:0;background:transparent;color:#667b94}.actions .create{border:1px solid #d5e2f5;border-radius:7px;background:#eaf2ff;color:#3868a9;padding:7px 11px}.content{height:calc(100vh - 64px);overflow:hidden;position:relative}.content img{display:block;width:100%;max-width:none;margin-top:-4%}.content.swap{animation:reveal .3s cubic-bezier(.22,1,.36,1)}@keyframes reveal{from{opacity:.68;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.desc{position:fixed;top:78px;right:18px;width:275px;padding:13px 16px;background:white;border:1px solid #dde7f2;border-radius:10px;box-shadow:0 5px 18px #263c5b16;z-index:3}.desc b{display:block;color:#2b4463}.desc span{font-size:12px;color:#647b95}.note{margin-top:8px;font-size:11px;color:#58718f}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:#293f5e;color:#d7e4f3;border-radius:10px;z-index:4;box-shadow:0 6px 20px #20345133}.switch span{padding:0 8px;font-size:12px;white-space:nowrap}.switch button{border:0;background:transparent;color:#d7e4f3;border-radius:6px;padding:8px 10px;white-space:nowrap}.switch button.active{background:white;color:#2f527d}@media(max-width:1050px){.header{height:auto;min-height:64px;flex-wrap:wrap;padding:9px 15px;gap:8px}.nav{order:3;flex-basis:100%;height:46px}.actions{margin-left:auto}.content{height:calc(100vh - 110px)}.desc{top:120px}}@media(max-width:650px){.brand span:last-child,.actions .status,.actions .create{display:none}.scope select{max-width:100px}.nav button{padding:0 9px}.switch span{display:none}.switch button{padding:8px 5px;font-size:12px}.desc{width:210px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style></head><body class="a"><header class="header"><div class="brand"><span class="logo">MTX</span><span>MTX</span></div><div class="scope"><select aria-label="当前项目"><option>Zata-Platform</option></select><span>/</span><select aria-label="当前迭代"><option>v1.2.0</option></select></div><nav class="nav" aria-label="主导航"><div class="indicator"></div></nav><div class="actions"><button class="status">测试阶段</button><button class="create">＋ 新建项目</button><button aria-label="主题">☼</button><button aria-label="用户">◯</button></div></header><main class="content"><img src="header-refinement-reference.png" alt="现有项目页面截图，仅作背景参考"></main><aside class="desc"><b id="name"></b><span id="description"></span><div class="note">点击顶部各项，来回切换体验动效。</div></aside><nav class="switch" aria-label="切换动效方案"><span>动效方案</span><button data-v="a">A 滑动线</button><button data-v="b">B 浮动底色</button><button data-v="c">C 轻弹跃</button><button data-v="d">D 页面呼吸</button></nav><script>
let variant=new URLSearchParams(location.search).get('variant')||'a',active='迭代';const items=['迭代','需求','测试','Bug列表','基础服务'], paths=['<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M6 2v4M14 2v4M3 8h14"/>','<path d="M5 2h7l3 3v13H5zM12 2v4h3M8 10h5M8 13h5"/>','<rect x="4" y="3" width="12" height="15" rx="2"/><path d="m7 11 2 2 4-5"/>','<path d="M6 8h8v5a4 4 0 0 1-8 0zM8 5h4M10 3v2M3 10h3M14 10h3M3 14h3M14 14h3"/>','<rect x="3" y="3" width="14" height="6" rx="2"/><rect x="3" y="11" width="14" height="6" rx="2"/><path d="M6 6h1M6 14h1"/>'];const info={a:['A · 滑动线','底部选中线平滑滑到目标项，轻量且方向清楚。'],b:['B · 浮动底色','浅色底板跟随选中项移动，状态更醒目。'],c:['C · 轻弹跃','选中线轻微回弹，图标同步上浮一点。'],d:['D · 页面呼吸','选中线平移，内容区域轻微淡入上移，强调页面切换。']};const nav=document.querySelector('.nav'),indicator=document.querySelector('.indicator'),content=document.querySelector('.content');items.forEach((x,i)=>{let b=document.createElement('button');b.innerHTML=`<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${paths[i]}</svg>${x}`;b.onclick=()=>{if(active===x)return;active=x;update();if(variant==='d'){content.classList.remove('swap');void content.offsetWidth;content.classList.add('swap')}};nav.append(b)});function update(){document.body.className=variant;document.querySelector('#name').textContent=info[variant][0];document.querySelector('#description').textContent=info[variant][1];document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant));const buttons=[...nav.querySelectorAll('button')];buttons.forEach((b,i)=>{b.classList.toggle('active',items[i]===active);b.setAttribute('aria-current',items[i]===active?'page':'false')});let target=buttons[items.indexOf(active)];indicator.style.left=(target.offsetLeft+(variant==='b'?0:13))+'px';indicator.style.width=(target.offsetWidth-(variant==='b'?0:26))+'px'}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;history.replaceState(null,'','?variant='+variant);update()});window.addEventListener('resize',update);update();
</script></body></html>
