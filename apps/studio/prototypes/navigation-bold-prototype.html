<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTX 导航交互 · 大胆探索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#1e304a;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7fa9e7;outline-offset:2px}.bar{height:66px;background:#fff;border-bottom:1px solid #e0e7f0;display:flex;align-items:center;gap:18px;padding:0 30px}.logo{font-weight:800;font-size:18px;color:#315fa3}.scope{color:#60748e;font-size:13px}.topaction{margin-left:auto;border:1px solid #dbe5f1;background:#f8fafd;padding:9px 14px;border-radius:8px;color:#385574}.topaction.primary{background:#263d5d;color:#fff;border-color:#263d5d}.canvas{max-width:1320px;margin:auto;padding:38px 38px 140px}.crumb{font-size:12px;color:#6c809a}.title{display:flex;justify-content:space-between;align-items:end;margin:22px 0 26px}.title h1{font-size:26px;margin:0;letter-spacing:-.02em}.title p{color:#6a7f98;margin:6px 0 0}.button{border:1px solid #d8e4f2;border-radius:8px;padding:9px 14px;background:#fff;color:#315e9d}.panel{background:#fff;border:1px solid #e0e8f1;border-radius:12px;overflow:hidden}.row{display:flex;align-items:center;gap:20px;padding:19px 22px;border-bottom:1px solid #edf1f6}.row:last-child{border:0}.row div{flex:1}.row strong{display:block;color:#315f9e}.row small{display:block;color:#71849b;margin-top:5px}.state{padding:5px 9px;border-radius:6px;background:#fff2dc;color:#8c5a13;font-size:12px}.note{font-size:12px;color:#687d96;margin-top:14px}.switcher{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:6px;border-radius:10px;color:#dce6f3;background:#243955;z-index:10;box-shadow:0 7px 22px #1d304c33}.switcher span{font-size:12px;padding:0 7px;white-space:nowrap}.switcher button{padding:8px 11px;background:transparent;color:#dce6f3;border:0;border-radius:6px;white-space:nowrap}.switcher button.active{background:#fff;color:#253e61}.scene{display:grid;grid-template-columns:290px 1fr;gap:18px}.mission{background:#263c5c;color:#fff;border-radius:12px;padding:23px}.mission small{color:#c2d0e2}.mission h2{font-size:21px;line-height:1.4;margin:12px 0}.mission p{color:#cad6e5;font-size:13px}.mission button{width:100%;border:0;border-radius:7px;padding:11px;background:#fff;color:#2c527e;text-align:left;margin-top:15px}.routes{background:#fff;border:1px solid #e0e8f1;border-radius:12px;padding:14px 22px}.route{display:flex;align-items:center;gap:15px;padding:16px 2px;border-bottom:1px solid #edf1f6}.route:last-child{border:0}.route .index{color:#6d87a9;font-size:12px;width:22px}.route div{flex:1}.route strong{display:block}.route small{color:#75879d}.route button{background:#eef4fd;border:0;border-radius:7px;color:#315f9e;padding:9px 13px}.overlay{position:fixed;inset:0;background:#12243bb5;z-index:4;display:flex;align-items:flex-start;justify-content:center;padding:10vh 20px}.palette{background:#fff;border-radius:14px;box-shadow:0 25px 80px #0f203a55;width:min(720px,100%);overflow:hidden}.search{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #e6ecf3}.search span{font-size:21px;color:#6680a2}.search input{border:0;outline:0;flex:1;font-size:17px;color:#223b5c}.search kbd{background:#edf2f7;border-radius:5px;padding:4px 7px;color:#607590}.palbody{padding:12px}.palgroup{padding:12px 12px 4px;color:#70839b;font-size:12px}.palitem{display:flex;width:100%;align-items:center;gap:15px;background:transparent;border:0;border-radius:8px;text-align:left;padding:11px 12px;color:#28415f}.palitem:hover{background:#edf4fd}.palitem b{display:block}.palitem small{color:#72859e}.palitem .go{margin-left:auto;color:#7890aa}.palfoot{padding:12px 22px;background:#f6f8fb;color:#72839a;font-size:12px}.map{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:1px;background:#dce5ef;border:1px solid #dce5ef;border-radius:12px;overflow:hidden}.mapcol{background:#fff;min-height:430px;padding:24px}.mapcol:nth-child(2){background:#f8fbff}.mapcol:nth-child(3){background:#f2f7fd}.mapcol h2{margin:0;font-size:16px}.mapcol p{color:#71849b;font-size:12px;margin:4px 0 20px}.mapitem{width:100%;text-align:left;border:0;border-bottom:1px solid #e8eef5;background:transparent;padding:14px 6px;color:#344c68;display:flex;justify-content:space-between}.mapitem.active{font-weight:700;color:#285fa9;background:#e7f1ff;border-radius:6px;padding-left:10px}.mapitem span{color:#7e93ad}.mapdetail{padding:18px;background:white;border:1px solid #dce7f4;border-radius:8px}.mapdetail h3{margin:0 0 5px;font-size:15px}.mapdetail p{line-height:1.8}.mapdetail button{background:#2c5e9e;color:white;border:0;border-radius:7px;padding:9px 13px}.helper{color:#68809c;font-size:12px}.backdrop{position:fixed;inset:66px 0 0;background:#273c5822;z-index:3}.drawer{position:fixed;z-index:4;top:66px;left:0;bottom:0;width:min(930px,95vw);background:#fff;box-shadow:12px 0 35px #1b304b25;padding:30px;overflow:auto}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.drawerhead h2{margin:0}.close{border:0;background:#edf2f8;padding:8px 12px;border-radius:7px;color:#506781}@media(max-width:760px){.bar{padding:0 15px}.scope{display:none}.canvas{padding:25px 15px 130px}.scene{grid-template-columns:1fr}.map{grid-template-columns:1fr}.mapcol{min-height:auto}.switcher span{display:none}.switcher button{font-size:12px;padding:8px 5px}}
</style></head><body><div id="app"></div><nav class="switcher"><span>大胆探索</span><button data-v="a">A 任务驾驶舱</button><button data-v="b">B 命令入口</button><button data-v="c">C 导航地图</button></nav><script>
let v=new URLSearchParams(location.search).get('variant')||'a',opened=false,current='需求列表',group='需求',stage='功能用例生成',query='';const groups=['迭代','需求','测试','Bug 列表','基础服务'];const stages=['需求列表','需求分析','功能用例生成','API 测试生成','UI 测试生成','代码风险分析'];function enter(x){current=x;opened=false;render()}function header(){return `<header class="bar"><span class="logo">MTX</span><span class="scope">Zata-Platform　/　v1.2.0</span><button class="topaction ${v==='a'?'primary':''}" onclick="${v==='a'?"enter('需求工作台')":"opened=true;render();setTimeout(()=>document.querySelector('input')?.focus(),0)"}">${v==='a'?'返回工作台':v==='b'?'⌕　前往任何地方　 Ctrl K':'▦　打开导航地图'}</button></header>`}function list(){return `<div class="panel"><div class="row"><div><strong>【数据处理管线】视频作业记录适配一对多切片逻辑</strong><small>需求 · 关联测试设计和生成结果</small></div><span class="state">待审核</span></div><div class="row"><div><strong>【任务管理】支持批量处理视频任务</strong><small>需求 · 功能用例生成中</small></div><span class="state">进行中</span></div><div class="row"><div><strong>【权限管理】项目成员角色设置</strong><small>需求 · 尚未开始生成</small></div><span class="state">未开始</span></div></div>`}function dashboard(){return `<div class="scene"><div class="mission"><small>当前工作范围</small><h2>Zata-Platform<br>v1.2.0</h2><p>从正在推进的工作出发，快速找到需求、生成任务和测试结果。</p><button onclick="enter('需求列表')">查看本迭代需求　→</button></div><div class="routes"><div class="route"><span class="index">01</span><div><strong>从需求开始</strong><small>查看需求及其关联的工作</small></div><button onclick="enter('需求列表')">打开需求 →</button></div><div class="route"><span class="index">02</span><div><strong>用模型设计测试</strong><small>需求分析、功能用例、API / UI 测试</small></div><button onclick="enter('功能用例生成')">生成用例 →</button></div><div class="route"><span class="index">03</span><div><strong>执行与跟踪</strong><small>测试单、用例库和 Bug</small></div><button onclick="enter('测试')">进入测试 →</button></div><div class="route"><span class="index">04</span><div><strong>配置与集成</strong><small>基础服务、模型和授权</small></div><button onclick="enter('基础服务')">管理服务 →</button></div></div></div>`}function content(){let d=v==='a'?'不以固定菜单为中心：进入工作台后按“我想完成什么”选择任务。':v==='b'?'将所有入口收进可搜索的命令面板，页面尽量留给实际工作。':'用一张三层导航地图展示模块、子功能和入口说明，选完即收起。';return `<main class="canvas"><div class="crumb">Zata-Platform　/　${current}</div><div class="title"><div><h1>${v==='a'&&current==='需求列表'?'今天从哪里开始？':current}</h1><p>${d}</p></div>${v==='a'?'':`<button class="button" onclick="opened=true;render();setTimeout(()=>document.querySelector('input')?.focus(),0)">${v==='b'?'搜索功能':'查看导航地图'}</button>`}</div>${v==='a'&&(current==='需求列表'||current==='需求工作台')?dashboard():list()}<p class="note">交互探索原型 · 使用示例数据，按钮展示导航体验。</p></main>`}function palette(){let all=[...groups,...stages];let match=all.filter(x=>x.includes(query));return `<div class="overlay" onclick="opened=false;render()"><div class="palette" onclick="event.stopPropagation()"><div class="search"><span>⌕</span><input placeholder="搜索需求、功能或操作…" value="${query}" oninput="query=this.value;updateResults()"><kbd>ESC</kbd></div><div class="palbody"><div class="palgroup">${query?'搜索结果':'常用入口 · 可输入关键词筛选'}</div><div id="results">${results(match)}</div></div><div class="palfoot">点击入口打开　·　Esc 关闭　·　Ctrl / ⌘ + K 呼出</div></div></div>`}function results(items){return items.length?items.map(x=>`<button class="palitem" onclick="enter('${x}')"><span>↗</span><div><b>${x}</b><small>${stages.includes(x)?'需求与模型生成':'工作空间'}</small></div><span class="go">打开 →</span></button>`).join(''):'<div class="palgroup">没有找到入口，请换个关键词。</div>'}function updateResults(){document.querySelector('#results').innerHTML=results([...groups,...stages].filter(x=>x.includes(query)))}function map(){return `<div class="backdrop" onclick="opened=false;render()"></div><div class="drawer"><div class="drawerhead"><div><h2>工作空间地图</h2><span class="helper">依次选择工作领域和具体功能</span></div><button class="close" onclick="opened=false;render()">关闭 ✕</button></div><div class="map"><div class="mapcol"><h2>工作领域</h2><p>先选择要处理的工作</p>${groups.map(x=>`<button class="mapitem ${group===x?'active':''}" onclick="group='${x}';render()">${x}<span>→</span></button>`).join('')}</div><div class="mapcol"><h2>${group}</h2><p>选择具体功能</p>${(group==='需求'?stages:[group]).map(x=>`<button class="mapitem ${stage===x?'active':''}" onclick="stage='${x}';render()">${x}<span>→</span></button>`).join('')}</div><div class="mapcol"><h2>即将进入</h2><p>了解入口的用途</p><div class="mapdetail"><h3>${stage}</h3><p>${stage==='功能用例生成'?'以需求为输入，查看模型生成的测试点与候选用例。':'查看与当前项目和迭代关联的工作内容。'}</p><button onclick="enter('${stage}')">进入 ${stage}　→</button></div></div></div></div>`}function render(){document.querySelector('#app').innerHTML=header()+content()+(opened?(v==='b'?palette():v==='c'?map():''):'');document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;current='需求列表';opened=v!=='a';query='';group='需求';stage='功能用例生成';history.replaceState(null,'','?variant='+v);render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened){opened=false;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&v==='b'){e.preventDefault();opened=true;render();document.querySelector('input')?.focus()}});render();
</script></body></html>
