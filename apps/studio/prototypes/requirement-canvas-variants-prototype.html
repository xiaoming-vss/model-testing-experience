<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求画布 · 三版设计预览</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--page:#0d1117;--panel:#161b22;--raised:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--orange:#ffa657;--blue-soft:rgba(56,139,253,.15);--green-soft:rgba(46,160,67,.15);--orange-soft:rgba(219,109,40,.15)}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.top{height:52px;display:flex;align-items:center;gap:15px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg)}.logo{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:#f0f6fc;color:#1f6feb;font-weight:800;font-size:14px}.project{padding:6px 12px;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px}.project b{color:var(--text);font-weight:500}.topnote{margin-left:auto;color:var(--muted);font-size:11px}.topnote span{color:var(--blue)}.shell{height:calc(100dvh - 52px);display:flex}.rail{flex:0 0 64px;border-right:1px solid var(--border);padding:15px 5px;background:var(--bg)}.rail-item{display:grid;place-items:center;height:55px;gap:2px;color:var(--muted);font-size:10px}.rail-item b{font-size:16px;color:#79a5d6;font-weight:400}.rail-item.active{background:var(--raised);color:var(--blue);border-radius:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 14px 14px}.head{display:flex;align-items:center;gap:12px;padding:0 10px 12px;border-bottom:1px solid var(--border)}.back{font-size:18px;color:var(--muted)}h1{font-size:15px;margin:0;font-weight:650}.badge{padding:2px 8px;color:var(--blue);border:1px solid #315681;background:var(--blue-soft);border-radius:20px;font-size:10px}.head-end{margin-left:auto;display:flex;gap:7px}.btn{border:1px solid var(--border);background:var(--raised);padding:6px 10px;border-radius:6px;color:var(--text);font-size:11px}.btn:hover{border-color:var(--blue)}.toolbar{height:52px;display:flex;align-items:center;gap:8px}.filters{display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:8px}.filters button{background:none;border:0;color:var(--muted);font-size:11px;padding:4px 9px;border-radius:5px}.filters button.active{background:var(--blue-soft);color:var(--blue)}.hint{margin-left:auto;color:var(--muted);font-size:11px}.workspace{display:flex;gap:10px;flex:1;min-height:0;padding-bottom:32px}.canvas-shell{position:relative;flex:1;min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:10px;background-color:var(--bg);background-image:radial-gradient(var(--border) .7px,transparent .8px);background-size:20px 20px}.viewport{position:absolute;inset:0;overflow:auto;cursor:grab;scrollbar-width:thin;scrollbar-color:var(--border) transparent}.viewport.dragging{cursor:grabbing}.world{position:relative;transform-origin:0 0;width:1260px;height:760px}.wires{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible}.wire{fill:none;stroke:var(--blue);stroke-width:1.3;opacity:.7}.wire.secondary{stroke:#6e7681;opacity:.45}.overview{position:absolute;top:25px;left:30px;color:var(--muted);font-size:11px;letter-spacing:.04em}.overview strong{display:block;color:var(--text);font-size:15px;letter-spacing:0;margin-top:5px}.canvas-footer{position:absolute;left:14px;bottom:13px;display:flex;gap:3px;align-items:center;padding:3px;background:var(--panel);border:1px solid var(--border);border-radius:7px}.canvas-footer button{border:0;background:none;padding:4px 8px;font-size:11px;color:var(--text)}.canvas-footer span{color:var(--muted);min-width:38px;text-align:center;font-size:11px}.canvas-footer .sep{width:1px;min-width:1px;height:15px;background:var(--border)}.inspector{width:260px;flex:0 0 260px;border:1px solid var(--border);background:var(--bg);border-radius:10px;overflow:auto}.inspect-head{padding:18px;border-bottom:1px solid var(--border)}.inspect-head .eyebrow{font-size:11px;color:var(--muted)}.inspect-head h2{font-size:16px;margin:7px 0 4px}.status{font-size:10px;color:var(--green);white-space:nowrap}.status.pending{color:var(--orange)}.status.idle{color:var(--muted)}.inspect-body{padding:18px}.inspect-body p{color:var(--muted);font-size:12px}.inspect-body dl{margin:16px 0;border-block:1px solid var(--border);padding:8px 0}.inspect-body dl div{display:flex;justify-content:space-between;padding:7px 0}.inspect-body dt{color:var(--muted)}.inspect-body dd{margin:0}.primary{width:100%;border:1px solid #2ea043;background:#238636;border-radius:6px;padding:9px;font-weight:600;margin:0 0 20px}.inspect-body h3{font-size:11px;margin:12px 0}.versions{display:flex;gap:6px}.versions button{border:1px solid var(--border);background:var(--raised);color:var(--muted);border-radius:5px;padding:4px 9px;font-size:11px}.versions button.chosen{border-color:#315681;background:var(--blue-soft);color:var(--blue)}.detail-help{padding-top:16px;margin-top:18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.8}.inspect-collapse{border:0;background:none;color:var(--muted);float:right}.group{position:absolute}.group-title{font-weight:650;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:13px}.group-title i{font-style:normal;font-size:10px;color:var(--muted);font-weight:400}.group-title .group-state{margin-left:auto;font-size:10px;color:var(--muted);font-weight:400}.nodes{display:flex;gap:16px}.node{position:relative;display:flex;align-items:center;text-align:left;border:1px solid var(--border);color:var(--text);background:var(--panel);border-radius:9px;transition:border-color .15s,background .15s}.node:hover{border-color:var(--blue)}.node.selected{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}.node.dim{opacity:.25}.node .index{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}.node .node-label{font-weight:600;font-size:12px}.node .meta{color:var(--muted);font-size:10px;white-space:nowrap}.dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--green)}.dot.pending{background:var(--orange)}.dot.idle{background:var(--muted)}.doc{width:172px}.risk{width:185px}.doc .node,.risk .node{width:100%;min-height:74px;padding:12px;gap:10px}.special-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;color:var(--blue);background:var(--blue-soft);font-size:15px}.stack{display:flex;flex-direction:column;gap:3px}.tag{font-size:10px;color:var(--muted)}.mobile-inspector{display:none}.mocknote{position:absolute;right:13px;bottom:14px;color:var(--muted);font-size:10px;background:var(--bg);padding:3px 6px}.switcher{position:fixed;z-index:30;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:5px;background:#e6edf3;border-radius:10px;box-shadow:0 8px 30px #0008;color:#0d1117}.switcher button{border:0;border-radius:6px;background:none;color:#57606a;padding:7px 11px;font-size:11px;font-weight:650}.switcher button:hover{background:#d0d7de}.switcher button.active{background:#0d1117;color:#fff}.switcher .switch-label{font-size:10px;padding:0 5px;color:#57606a}.switcher .arrow{font-size:15px;padding:3px 8px}.toast{position:fixed;left:50%;top:75px;transform:translateX(-50%);background:#30363d;border:1px solid #484f58;padding:9px 14px;border-radius:8px;z-index:40;font-size:12px}.v-a .group-box{padding:14px 16px 16px;border:1px solid var(--border);border-radius:10px;background:rgba(22,27,34,.72)}.v-a .node{height:65px;width:142px;padding:10px;gap:8px}.v-a .node .stack{gap:2px}.v-a .node .index{position:absolute;right:9px;top:8px}.v-a .doc .node,.v-a .risk .node{width:100%;height:70px}.v-a .doc,.v-a .risk{width:180px}.v-b .group-title{margin:0 0 10px}.v-b .group-title:before{content:"";width:7px;height:7px;background:var(--blue);border-radius:50%}.v-b .track{display:flex;align-items:center;gap:0}.v-b .node{height:50px;width:143px;gap:8px;padding:8px 11px;border-radius:7px}.v-b .node:not(:last-child){margin-right:28px}.v-b .node .index{color:var(--blue);font-size:10px}.v-b .node .meta{display:none}.v-b .node .node-label{font-size:11px}.v-b .doc .node,.v-b .risk .node{width:100%;height:64px}.v-b .group-box{padding:0}.v-b .function,.v-b .ui{border-top:1px solid var(--border);padding-top:15px}.v-c .group-box{padding:0}.v-c .group-title{font-size:13px;margin-bottom:12px}.v-c .nodes{flex-direction:column;gap:7px}.v-c .node{height:44px;width:245px;padding:7px 11px;gap:10px;border-radius:7px}.v-c .node .stack{flex-direction:row;align-items:center;gap:9px;flex:1}.v-c .node .meta{margin-left:auto}.v-c .node .index{font-size:10px}.v-c .node .dot{order:3}.v-c .function,.v-c .api,.v-c .ui,.v-c .analysis{width:270px;padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}.v-c .doc .node,.v-c .risk .node{width:100%;height:65px}.v-c .node{background:var(--bg)}.v-c .doc,.v-c .risk{width:190px}@media(max-width:900px){.rail{display:none}.inspector{display:none}.mobile-inspector{display:block;position:absolute;right:12px;top:12px;z-index:2;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--panel);font-size:11px;color:var(--muted)}.hint,.topnote,.head-end{display:none}.world{width:1260px}.main{padding:10px}.switcher{bottom:8px}}@media(max-width:650px){.inspector{display:none}.project{font-size:10px}.switcher button{padding:7px}}
</style></head><body>
<header class="top"><span class="logo">M<span style="color:#238636">x</span></span><div class="project">当前项目　/　<b>Zata-Platform</b>　　│　当前迭代　/　<b>v1.2.0</b></div><div class="topnote"><span>需求画布设计预览</span>　·　示例数据 · 不会修改平台数据</div></header>
<div class="shell"><nav class="rail" aria-label="平台导航"><div class="rail-item"><b>▦</b>迭代</div><div class="rail-item active"><b>▤</b>需求</div><div class="rail-item"><b>☑</b>测试</div><div class="rail-item"><b>♧</b>Bug列表</div><div class="rail-item"><b>▥</b>基础服务</div></nav><main class="main"><div class="head"><span class="back">‹</span><h1>【Export数据工厂】转换数据</h1><span class="badge">需求</span><div class="head-end"><button class="btn mock">下载原文件</button><button class="btn mock">编辑需求</button></div></div><div class="toolbar"><div class="filters" aria-label="筛选"><button class="active" data-filter="all">全部 4</button><button data-filter="pending">待审核 1</button><button data-filter="idle">未开始 1</button></div><span class="hint">选择节点查看详情 · 拖动画布移动</span></div><div class="workspace"><section class="canvas-shell" aria-label="需求流程画布"><div class="viewport" id="viewport"><div id="world" class="world"><svg class="wires" id="wires"></svg><div class="overview">REQUIREMENT FLOW<strong id="variant-title"></strong></div><div id="groups"></div></div></div><div class="canvas-footer"><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">＋</button><span class="sep"></span><button id="fit">适应画布</button></div><div class="mobile-inspector" id="mobile-inspector"></div><div class="mocknote">示例数据 · 可拖拽画布</div></section><aside class="inspector" id="inspector"></aside></div></main></div>
<div class="switcher" aria-label="预览方案切换"><span class="switch-label">设计预览</span><button class="arrow" data-step="-1" aria-label="上一版">‹</button><button data-variant="A">A 轻量卡片</button><button data-variant="B">B 轨道流程</button><button data-variant="C">C 分层清单</button><button class="arrow" data-step="1" aria-label="下一版">›</button></div>
<script>
// Read-only, throwaway prototype: three variants selected by ?variant=A|B|C.
const data={doc:{name:'查看需求文档',section:'需求文档',summary:'生成链读取最新正文',state:'只读来源',kind:'idle',icon:'▤'},extract:{name:'提取与整理',section:'需求分析',summary:'7 个字段',version:'v1',state:'已通过'},understand:{name:'需求理解',section:'需求分析',summary:'4 个模块',version:'v1',state:'已通过'},analysis:{name:'测试需求分析',section:'功能测试',summary:'5 个字段',version:'v1',state:'已通过'},points:{name:'测试点',section:'功能测试',summary:'4 个分类',version:'v1',state:'已通过'},cases:{name:'完整用例',section:'功能测试',summary:'68 条用例',version:'v1',state:'已导入'},api:{name:'开始 API 测试',section:'API 测试',summary:'尚未配置生成链',state:'未开始',kind:'idle'},surface:{name:'元素控件清单',section:'UI 测试',summary:'6 个页面',version:'v2',state:'已通过'},design:{name:'UI 用例设计',section:'UI 测试',summary:'68 条用例',version:'v2',state:'已通过'},yaml:{name:'用例 YAML',section:'UI 测试',summary:'68 条记录',version:'待审核',state:'待审核',kind:'pending'},risk:{name:'代码风险分析',section:'代码风险',summary:'独立分析链',state:'独立',kind:'idle',icon:'◇'}};
const configs={A:{title:'轻量卡片 · 保留流程结构，缩小节点',positions:{doc:[48,300],analysis:[295,280],function:[690,120],api:[690,325],ui:[690,530],risk:[48,585]}},B:{title:'轨道流程 · 减少外框，让关系更清晰',positions:{doc:[48,310],analysis:[285,285],function:[690,115],api:[690,325],ui:[690,510],risk:[48,575]}},C:{title:'分层清单 · 节点纵向排列，便于扫描',positions:{doc:[48,260],analysis:[310,155],function:[690,60],api:[1000,180],ui:[690,380],risk:[48,520]}}};
const groups=[{id:'doc',title:'需求文档',items:['doc'],special:true},{id:'analysis',title:'需求分析',items:['extract','understand'],status:'已通过'},{id:'function',title:'功能测试',items:['analysis','points','cases'],status:'已通过'},{id:'api',title:'API 测试',items:['api'],status:'未开始'},{id:'ui',title:'UI 测试',items:['surface','design','yaml'],status:'1 个待审核'},{id:'risk',title:'代码风险',items:['risk'],special:true}];
const wires=[['doc','extract'],['extract','understand'],['understand','analysis'],['analysis','points'],['points','cases'],['understand','api'],['understand','surface'],['surface','design'],['design','yaml']];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!configs[variant])variant='A';let selected='yaml',filter='all',zoom=1;
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),svg=document.getElementById('wires');
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2200)}
function node(id,index,special){const item=data[id];let el=document.createElement('button');el.className='node'+(selected===id?' selected':'')+((filter==='pending'&&item.kind!=='pending'||filter==='idle'&&item.kind!=='idle')?' dim':'');el.dataset.node=id;let dot=item.kind||'';el.innerHTML=special?`<span class="special-icon">${item.icon||'↗'}</span><span class="stack"><span class="node-label">${item.name}</span><span class="meta">${item.summary}</span></span>`:`<span class="index">${String(index+1).padStart(2,'0')}</span><span class="stack"><span class="node-label">${item.name}</span><span class="meta">${item.version||'—'} · ${item.summary}</span></span><span class="dot ${dot}"></span>`;el.onclick=()=>{selected=id;render()};return el}
function render(){document.body.className='v-'+variant.toLowerCase();document.getElementById('variant-title').textContent=configs[variant].title;document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});const host=document.getElementById('groups');host.replaceChildren();for(const group of groups){const el=document.createElement('div');el.className=`group ${group.id}${group.special?' '+group.id:''}`;const p=configs[variant].positions[group.id];el.style.left=p[0]+'px';el.style.top=p[1]+'px';let box=document.createElement('div');box.className='group-box';let title=document.createElement('div');title.className='group-title';title.innerHTML=`${group.title} <i>${group.special?(group.id==='doc'?'只读来源':'独立'):''}</i><span class="group-state">${group.status||''}</span>`;box.append(title);let list=document.createElement('div');list.className=variant==='B'?'nodes track':'nodes';group.items.forEach((id,i)=>list.append(node(id,i,group.special)));box.append(list);el.append(box);host.append(el)}renderInspector();requestAnimationFrame(drawWires)}
function drawWires(){svg.replaceChildren();for(const [from,to] of wires){let a=world.querySelector(`[data-node="${from}"]`),b=world.querySelector(`[data-node="${to}"]`);if(!a||!b)continue;let ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),wr=world.getBoundingClientRect();let ax=(ar.right-wr.left)/zoom,ay=(ar.top+ar.height/2-wr.top)/zoom,bx=(br.left-wr.left)/zoom,by=(br.top+br.height/2-wr.top)/zoom;if(variant==='C'&&from!=='doc'&&from!=='understand'&&from!=='extract'){ax=(ar.left+ar.width/2-wr.left)/zoom;ay=(ar.bottom-wr.top)/zoom;bx=(br.left+br.width/2-wr.left)/zoom;by=(br.top-wr.top)/zoom}let path=document.createElementNS('http://www.w3.org/2000/svg','path');let vertical=variant==='C'&&Math.abs(ax-bx)<3;let mid=(ax+bx)/2;path.setAttribute('d',vertical?`M ${ax} ${ay} L ${bx} ${by}`:`M ${ax} ${ay} H ${mid} V ${by} H ${bx}`);path.setAttribute('class','wire'+(data[to].kind==='idle'?' secondary':''));svg.append(path)}}
function renderInspector(){const item=data[selected];document.getElementById('mobile-inspector').textContent=item.section+' / '+item.name+' · '+item.state;const stateClass=item.kind==='pending'?'pending':item.kind==='idle'?'idle':'';document.getElementById('inspector').innerHTML=`<div class="inspect-head"><button class="inspect-collapse" title="预览提示">⋯</button><div class="eyebrow">${item.section} / 阶段详情</div><h2>${item.name}</h2><span class="status ${stateClass}">● ${item.state}</span></div><div class="inspect-body"><p>${item.summary}</p><dl><div><dt>所属阶段</dt><dd>${item.section}</dd></div><div><dt>当前版本</dt><dd>${item.version||'—'}</dd></div><div><dt>当前状态</dt><dd>${item.state}</dd></div></dl><button class="primary mock">${item.kind==='pending'?'查看并审核':item.kind==='idle'?'查看详情':'查看产物'}</button><h3>版本选择</h3><div class="versions"><button class="chosen">${item.version||'当前'}</button>${item.version==='v2'?'<button>v1</button>':''}</div><div class="detail-help">${item.kind==='pending'?'待审核操作<br>审核通过 · 审核不通过 · 继续优化':'选中节点后在这里查看版本、产物和可用操作。'}<br><br>这是交互原型，业务操作仅作展示。</div></div>`;document.querySelectorAll('.mock').forEach(b=>b.onclick=()=>toast('预览模式：这里展示原有平台操作'));document.querySelectorAll('.versions button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.versions button').forEach(n=>n.classList.remove('chosen'));b.classList.add('chosen')})}
function selectVariant(v){variant=v;const u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);render();viewport.scrollTo(0,0)}document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>selectVariant(b.dataset.variant));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let a=['A','B','C'];selectVariant(a[(a.indexOf(variant)+Number(b.dataset.step)+3)%3])});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){let a=['A','B','C'];selectVariant(a[(a.indexOf(variant)+(e.key==='ArrowRight'?1:2))%3])}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});function setZoom(n){zoom=Math.max(.35,Math.min(1.3,n));world.style.transform=`scale(${zoom})`;document.getElementById('zoom').textContent=Math.round(zoom*100)+'%';drawWires()}document.getElementById('minus').onclick=()=>setZoom(zoom-.1);document.getElementById('plus').onclick=()=>setZoom(zoom+.1);document.getElementById('fit').onclick=()=>{setZoom(Math.min((viewport.clientWidth-24)/1260,(viewport.clientHeight-24)/760,1));viewport.scrollTo(0,0)};let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});viewport.addEventListener('pointermove',e=>{if(drag){viewport.scrollLeft=drag.left-(e.clientX-drag.x);viewport.scrollTop=drag.top-(e.clientY-drag.y)}});viewport.addEventListener('pointerup',()=>{drag=null;viewport.classList.remove('dragging')});window.addEventListener('resize',drawWires);render();requestAnimationFrame(()=>{if(viewport.clientWidth<1260||viewport.clientHeight<760)setZoom(Math.min(1,(viewport.clientWidth-24)/1280,(viewport.clientHeight-24)/760))});
</script></body></html>
