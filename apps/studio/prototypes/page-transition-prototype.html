<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面切换动效探索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#344b68;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #6995d9;outline-offset:2px}.top{height:64px;display:flex;align-items:center;gap:18px;background:#f8fafd;border-bottom:1px solid #dfe8f3;padding:0 24px}.brand{display:flex;align-items:center;gap:8px;font-weight:700}.logo{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid #dce7f4;background:#fff;color:#3873bf;font-size:10px}.scope{white-space:nowrap;color:#506984}.nav{display:flex;align-items:center;gap:3px;flex:1}.nav button{border:0;background:transparent;color:#546c88;border-radius:8px;padding:9px 14px}.nav button.active{background:#e8f1ff;color:#3167b1;font-weight:700}.actions{white-space:nowrap;color:#617993}.actions button{border:1px solid #d2e1f6;border-radius:7px;background:#eaf2ff;color:#3869aa;padding:7px 11px}.viewport{height:calc(100vh - 64px);overflow:hidden;position:relative;background:#f5f8fc}.page{height:100%;overflow:hidden;transform-origin:50% 0}.page img{width:100%;max-width:none;display:block;margin-top:-4%}.page.requirement img{width:108%;margin-left:-7.8%;margin-top:-2.8%}.page.enter-a{animation:fade 240ms ease-out both}.page.enter-b{animation:up 320ms cubic-bezier(.22,1,.36,1) both}.page.enter-c{animation:side 340ms cubic-bezier(.22,1,.36,1) both}.page.enter-c.reverse{animation-name:sideReverse}.page.enter-d{animation:scale 320ms cubic-bezier(.22,1,.36,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes side{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}@keyframes sideReverse{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}@keyframes scale{from{opacity:0;transform:scale(.988)}to{opacity:1;transform:scale(1)}}.desc{position:fixed;right:18px;top:78px;z-index:3;width:265px;background:#fff;border:1px solid #dce7f3;border-radius:10px;padding:13px 16px;box-shadow:0 5px 18px #263c5b16}.desc b{display:block;color:#294362}.desc span{font-size:12px;color:#647b95}.desc p{font-size:12px;color:#58718f;margin:8px 0 0}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:#293f5e;color:#d7e4f3;border-radius:10px;z-index:4;box-shadow:0 6px 20px #20345133}.switch span{padding:0 8px;font-size:12px;white-space:nowrap}.switch button{border:0;background:transparent;color:#d7e4f3;border-radius:6px;padding:8px 10px;white-space:nowrap}.switch button.active{background:white;color:#2f527d}.note{position:fixed;bottom:16px;right:14px;padding:5px 8px;border-radius:6px;background:#fff;color:#6c8098;font-size:11px}@media(max-width:800px){.top{padding:0 12px;gap:8px}.scope,.actions{display:none}.nav{overflow:auto}.nav button{white-space:nowrap;padding:9px}.desc{top:73px;width:210px}.switch span{display:none}.switch button{font-size:12px;padding:8px 6px}.note{display:none}}@media(prefers-reduced-motion:reduce){.page{animation:none!important}}
</style></head><body><header class="top"><div class="brand"><span class="logo">MTX</span> MTX</div><div class="scope">Zata-Platform　/　v1.2.0</div><nav class="nav" aria-label="页面切换"><button data-page="0" class="active">迭代</button><button data-page="1">需求</button></nav><div class="actions">测试阶段　 <button>＋ 新建项目</button>　☼　◯</div></header><main class="viewport"><div class="page" id="page"><img id="screen" src="header-refinement-reference.png" alt="现有迭代页面示意"></div></main><aside class="desc"><b id="name"></b><span id="description"></span><p>点击顶部「迭代」「需求」来回切换。</p></aside><nav class="switch" aria-label="选择页面切换动效"><span>页面动效</span><button data-v="a">A 淡入</button><button data-v="b">B 轻上移</button><button data-v="c">C 方向滑入</button><button data-v="d">D 微缩放</button></nav><div class="note">使用现有页面截图模拟切换</div><script>
let variant=new URLSearchParams(location.search).get('variant')||'a',active=0;const info={a:['A · 淡入','只调整透明度，简洁克制，适合高频切换。'],b:['B · 轻上移','页面轻微上移并淡入，让内容出现更自然。'],c:['C · 方向滑入','根据导航顺序从左或右滑入，切换方向更明确。'],d:['D · 微缩放','内容从略小的状态淡入，带一点进入感。']};const page=document.querySelector('#page'),screen=document.querySelector('#screen');function update(){document.querySelector('#name').textContent=info[variant][0];document.querySelector('#description').textContent=info[variant][1];document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===active))}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{let next=Number(b.dataset.page);if(next===active)return;let reverse=next<active;active=next;page.className='page'+(active?' requirement':'');screen.src=active?'top-navigation-current-page-reference.png':'header-refinement-reference.png';screen.alt=active?'现有需求详情页面示意':'现有迭代页面示意';void page.offsetWidth;page.classList.add('enter-'+variant);if(reverse)page.classList.add('reverse');update()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;history.replaceState(null,'','?variant='+variant);update()});update();
</script></body></html>
