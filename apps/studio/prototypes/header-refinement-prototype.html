<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顶部区域优化方案</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#31455f;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #6391db;outline-offset:2px}.header{height:64px;display:flex;align-items:center;gap:18px;padding:0 25px;border-bottom:1px solid #dfe8f3;background:#f8fafd}.brand{font-size:14px;font-weight:750;display:flex;align-items:center;gap:9px;flex:none;color:#334b6a}.logo{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:#fff;color:#3871b8;border:1px solid #dbe6f3;font-size:10px}.scope{display:flex;align-items:center;gap:5px;flex:none}.scope select{border:0;background:transparent;color:#395371;cursor:pointer;max-width:145px}.scope .slash{color:#9bacc0}.nav{display:flex;align-items:center;gap:3px;min-width:0;flex:1;overflow:auto;scrollbar-width:thin}.nav button{background:transparent;border:0;color:#506884;white-space:nowrap;border-radius:8px;padding:9px 13px;display:flex;align-items:center;gap:7px}.nav button.active{background:#e8f1ff;color:#3064aa;font-weight:700}.icon{width:16px;height:16px;stroke:#5e8bc9;fill:none;stroke-width:1.7}.actions{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}.actions button{background:transparent;border:0;color:#60758e}.actions .create{padding:7px 11px;border-radius:7px;background:#eaf2ff;color:#3a68a8;border:1px solid #d3e1f5}.content{height:calc(100vh - 64px);overflow:hidden;position:relative}.content img{width:100%;max-width:none;display:block;margin-top:-4%}.desc{position:fixed;right:18px;top:78px;z-index:3;background:white;border:1px solid #dde7f2;border-radius:10px;box-shadow:0 5px 18px #263c5b16;padding:13px 16px;width:265px}.desc b{display:block;color:#2b4463}.desc span{font-size:12px;color:#647b95}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:#293f5e;color:#d7e4f3;border-radius:10px;z-index:4;box-shadow:0 6px 20px #20345133}.switch span{padding:0 8px;font-size:12px;white-space:nowrap}.switch button{border:0;background:transparent;color:#d7e4f3;border-radius:6px;padding:8px 10px;white-space:nowrap}.switch button.active{background:white;color:#2f527d}.note{position:fixed;right:14px;bottom:16px;color:#6a7f98;background:white;border-radius:6px;padding:5px 8px;font-size:11px}.a .scope{background:#edf3fb;border:1px solid #dce7f4;border-radius:8px;padding:8px 10px}.a .scope select{font-weight:600}.b .header{gap:12px}.b .scope{border:1px solid #dce7f3;border-radius:9px;background:#fff;padding:4px}.b .scope select{padding:6px 7px}.b .scope select+select{border-left:1px solid #e3ebf5}.b .scope .slash{display:none}.b .nav{margin-left:8px}.c .brand{gap:6px}.c .scope{background:transparent;gap:1px}.c .scope select{padding:6px 5px;font-weight:600}.c .scope .slash{padding:0 3px}.c .nav{border:0;gap:4px;margin-left:5px}.c .nav button.active{background:transparent;position:relative}.c .nav button.active:after{content:'';position:absolute;bottom:0;left:13px;right:13px;height:2px;background:#4778c1;border-radius:2px}.d .header{height:92px;align-items:flex-start;position:relative;padding-top:12px}.d .scope{background:#edf3fb;border-radius:7px;padding:6px 9px}.d .actions{margin-left:auto}.d .nav{position:absolute;left:24px;bottom:0;height:37px}.d .nav button{height:35px;padding:5px 12px}.d .content{height:calc(100vh - 92px)}@media(max-width:1100px){.header{height:auto;min-height:64px;flex-wrap:wrap;padding:9px 15px;gap:8px}.nav{order:3;flex-basis:100%}.actions{margin-left:auto}.d .header{height:105px}.d .nav{left:15px}.desc{top:120px}.d .desc{top:115px}}@media(max-width:650px){.brand span:last-child,.actions .status,.actions .create{display:none}.scope select{max-width:105px}.nav button{padding:8px}.switch span{display:none}.switch button{padding:8px 5px;font-size:12px}.note{display:none}.desc{width:220px}}
</style></head><body><div id="app"></div><nav class="switch" aria-label="切换顶部优化方案"><span>顶部优化</span><button data-v="a">A 聚合工作区</button><button data-v="b">B 轻量选择器</button><button data-v="c">C 轻导航</button><button data-v="d">D 分层布局</button></nav><div class="note">下方为现有页面截图 · 顶部为交互演示</div><script>
let v=new URLSearchParams(location.search).get('variant')||'a',project='Zata-Platform',sprint='v1.2.0',active='迭代';const variants={a:['聚合工作区','把项目与迭代收成一组，减少分隔线；导航从同一基线自然展开。'],b:['轻量选择器','保留两个独立下拉，缩短内部留白，让范围切换与导航更平衡。'],c:['轻导航','去掉多余边界和选中底块，以细线强调当前模块，让整行更轻。'],d:['分层布局','上层放工作范围和操作，下层放导航，适合希望各区域更清晰的场景。']};function icon(i){const paths=['<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M6 2v4M14 2v4M3 8h14"/>','<path d="M5 2h7l3 3v13H5zM12 2v4h3M8 10h5M8 13h5"/>','<rect x="4" y="3" width="12" height="15" rx="2"/><path d="m7 11 2 2 4-5"/>','<path d="M6 8h8v5a4 4 0 0 1-8 0zM8 5h4M10 3v2M3 10h3M14 10h3M3 14h3M14 14h3"/>','<rect x="3" y="3" width="14" height="6" rx="2"/><rect x="3" y="11" width="14" height="6" rx="2"/><path d="M6 6h1M6 14h1"/>'];return `<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${paths[i]}</svg>`}function render(){document.body.className=v;document.querySelector('#app').innerHTML=`<header class="header"><div class="brand"><span class="logo">MTX</span><span>MTX</span></div><div class="scope"><select aria-label="当前项目" onchange="project=this.value"><option ${project==='Zata-Platform'?'selected':''}>Zata-Platform</option><option ${project==='示例项目'?'selected':''}>示例项目</option></select><span class="slash">/</span><select aria-label="当前迭代" onchange="sprint=this.value"><option ${sprint==='v1.2.0'?'selected':''}>v1.2.0</option><option ${sprint==='v1.1.0'?'selected':''}>v1.1.0</option><option ${sprint==='全部迭代'?'selected':''}>全部迭代</option></select></div><nav class="nav" aria-label="主导航">${['迭代','需求','测试','Bug列表','基础服务'].map((x,i)=>`<button class="${active===x?'active':''}" onclick="active='${x}';render()">${icon(i)}${x}</button>`).join('')}</nav><div class="actions"><button class="status" title="需求、想法和问题，请联系 limingjiang.x@gmail.com">测试阶段</button><button class="create">＋ 新建项目</button><button aria-label="主题">☼</button><button aria-label="用户">◯</button></div></header><main class="content"><img src="header-refinement-reference.png" alt="现有项目页面参考图"></main><div class="desc"><b>${v.toUpperCase()} · ${variants[v][0]}</b><span>${variants[v][1]}</span></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;history.replaceState(null,'','?variant='+v);render()});render();
</script></body></html>
