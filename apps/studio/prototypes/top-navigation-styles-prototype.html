ottom:1px solid #edf1f6;display:flex;gap:16px;align-items:center}.tablehead{color:#72849b;font-size:12px;background:#fafbfd}.tablehead strong{color:#304962;font-size:14px}.tablehead span{margin-left:auto}.row:last-child{border:0}.row div{flex:1}.row b{display:block;color:#3566a6}.row small{display:block;color:#73869e;margin-top:5px}.tag{border-radius:6px;padding:5px 9px;background:#fff3df;color:#8c5d1d;font-size:12px}.caption{color:#71849b;margin:14px 0;font-size:12px}.switcher{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:5px;align-items:center;padding:6px;background:#243b5b;color:#dbe7f6;border-radius:10px;box-shadow:0 7px 20px #1a2d4933}.switcher span{font-size:12px;padding:0 8px;white-space:nowrap}.switcher button{border:0;background:transparent;color:#dbe7f6;border-radius:6px;padding:8px 11px;white-space:nowrap}.switcher button.active{background:white;color:#2f5079}.dark{background:#253b5a;color:#d7e2f0}.dark .brand{color:white}.dark .brand small,.dark .scope{color:#bbcde3}.dark .nav button{color:#cbd8e9}.dark .nav button.active{color:#fff;background:#405b7e;border-radius:8px}.dark .nav{align-items:center}.dark .nav button{height:38px}.dark .avatar{background:#4f6786;color:white}.subdark{background:#fff;border:0;border-bottom:1px solid #dfe7f2}.subdark .lead{font-weight:700;color:#304b6e;margin-right:12px}.subdark button.active{background:#edf4fd}.floathead{background:transparent;border:0;padding:16px 25px 0}.floathead .bar{background:white;border:1px solid #dce7f3;border-radius:12px;height:62px;box-shadow:0 3px 12px #25415c0a;padding:0 20px}.pillnav{background:#f1f5fa;border-radius:9px;padding:4px;align-self:auto}.pillnav button{height:34px;border-radius:7px;padding:0 14px}.pillnav button.active{background:#fff;box-shadow:0 1px 4px #25415c18}.dropdown{position:absolute;top:82px;left:50%;transform:translateX(-50%);width:min(900px,90vw);z-index:5;background:white;border:1px solid #dce6f2;border-radius:12px;box-shadow:0 14px 35px #233d5d26;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:18px}.dropdown .intro{background:#f2f6fc;border-radius:8px;padding:16px;color:#536c89}.dropdown .intro strong{display:block;color:#283f5c;font-size:16px}.dropdown .intro p{font-size:12px;line-height:1.7}.menu{display:grid;grid-template-columns:1fr 1fr;gap:5px}.menu button{border:0;background:transparent;padding:10px 12px;text-align:left;color:#334d6e;border-radius:7px}.menu button:hover,.menu button.active{background:#edf4ff;color:#285fa8}.menu button strong,.menu button small{display:block}.menu button small{font-size:12px;color:#71849b;margin-top:2px}.dropdown .close{border:0;background:transparent;color:#6d8099;position:absolute;right:12px;top:10px}.ribbon{background:#fff;border-bottom:1px solid #e1e8f2}.ribbon .bar{height:58px}.ribbonnav{display:flex;gap:0;align-items:stretch;padding:0 32px;background:#fff}.ribbonnav button{flex:1;text-align:left;background:transparent;border:0;border-top:1px solid #edf1f6;padding:15px 16px;color:#506780}.ribbonnav button+button{border-left:1px solid #edf1f6}.ribbonnav button.active{background:#edf4fd;color:#2d61a7}.ribbonnav button b,.ribbonnav button small{display:block}.ribbonnav button small{font-size:11px;color:#72879f;margin-top:3px}.ribbonsub{background:#e9f1fb;border-bottom:1px solid #dce7f5;padding:8px 32px;display:flex;align-items:center;gap:7px}.ribbonsub span{font-size:12px;color:#617a9a;margin-right:10px}.ribbonsub button{border:0;background:transparent;color:#55708f;padding:7px 11px;border-radius:6px;white-space:nowrap}.ribbonsub button.active{background:white;color:#2c61a7;font-weight:700}@media(max-width:900px){.bar{padding:0 15px;gap:10px}.scope,.secondary .end{display:none}.nav{overflow:auto}.nav button{padding:0 9px}.secondary,.ribbonsub{overflow:auto;padding-left:15px}.body{padding:25px 16px 120px}.ribbonnav{overflow:auto;padding:0 15px}.ribbonnav button{min-width:130px}.dropdown{grid-template-columns:1fr}.dropdown .intro{display:none}.switcher span{display:none}.switcher button{font-size:12px;padding:8px 5px}}
.reference-page{height:calc(100vh - 120px);overflow:hidden;background:#f7f9fc;position:relative}.reference-page img{display:block;width:108%;max-width:none;margin-left:-7.8%;margin-top:-2.8%}.reference-label{position:fixed;right:16px;bottom:18px;color:#61748b;background:#fff;padding:5px 9px;border-radius:6px;font-size:11px;z-index:4}</style></head><body><div id="app"></div><nav class="switcher" aria-label="切换顶部导航样式"><span>顶部导航设计</span><button data-v="a">A 轻量双层</button><button data-v="b">B 深色聚焦</button><button data-v="c">C 悬浮菜单</button><button data-v="d">D 工作区域</button></nav><script>
let v=new URLSearchParams(location.search).get('variant')||'a',group='需求',current='需求列表',opened=false;const groups=['迭代','需求','测试','Bug 列表','基础服务'], items=['需求列表','需求分析','功能用例生成','API 测试生成','UI 测试生成','代码风险分析'], descriptions=['查看当前迭代需求','从需求材料提取与理解','生成并审核候选用例','生成 API 测试内容','生成 UI 测试内容','查看代码变更风险'];function chooseGroup(x){group=x;if(v==='c'&&x==='需求'){opened=!opened;render();return}current=x==='需求'?'需求列表':x;opened=false;render()}function choose(x){current=x;group='需求';opened=false;render()}function nav(cls=''){return `<nav class="nav ${cls}" aria-label="一级导航">${groups.map(x=>`<button class="${group===x?'active':''}" onclick="chooseGroup('${x}')">${x}${v==='c'&&x==='需求'?' ⌄':''}</button>`).join('')}</nav>`}function second(cls='secondary'){return group==='需求'?`<div class="${cls}">${cls==='ribbonsub'?'<span>需求工作流</span>':v==='b'?'<span class="lead">需求工作台</span>':'<span class="path">需求 /</span>'}${items.map(x=>`<button class="${current===x?'active':''}" onclick="choose('${x}')">${x}</button>`).join('')}${cls==='secondary'?'<span class="end">当前迭代 · v1.2.0</span>':''}</div>`:''}function header(){if(v==='c')return `<header class="floathead"><div class="bar"><span class="brand">MTX <small>工作台</small></span><span class="scope">Zata-Platform / v1.2.0　⌄</span><div class="push"></div>${nav('pillnav')}<button class="avatar">M</button></div></header>${opened?`<div class="dropdown"><div class="intro"><strong>需求工作台</strong><p>从需求出发，查看分析、模型生成和相关测试结果。</p><small>当前项目 · Zata-Platform</small></div><div class="menu">${items.map((x,i)=>`<button class="${current===x?'active':''}" onclick="choose('${x}')"><strong>${x}</strong><small>${descriptions[i]}</small></button>`).join('')}</div><button class="close" onclick="opened=false;render()">✕</button></div>`:''}`;if(v==='d')return `<header class="ribbon"><div class="bar"><span class="brand">MTX <small>工作台</small></span><span class="scope">Zata-Platform　/　v1.2.0　⌄</span><div class="push"></div><button class="avatar">M</button></div><nav class="ribbonnav">${groups.map((x,i)=>`<button class="${group===x?'active':''}" onclick="chooseGroup('${x}')"><b>${x}</b><small>${['计划与迭代','需求与模型生成','用例与执行','问题与追踪','模型与集成'][i]}</small></button>`).join('')}</nav>${second('ribbonsub')}</header>`;return `<header class="head ${v==='b'?'dark':''}"><div class="bar"><span class="brand">MTX <small>工作台</small></span><span class="scope">Zata-Platform　/　v1.2.0　⌄</span>${nav(v==='a'?'underline':'')}<div class="push"></div><button class="avatar">M</button></div></header>${second('secondary '+(v==='b'?'subdark':''))}`}function content(){return `<main class="reference-page" aria-label="现有需求详情页面参考"><img src="top-navigation-current-page-reference.png" alt="当前需求详情画布参考，包含需求分析、功能测试、API 测试和 UI 测试"></main><div class="reference-label">下方为现有页面截图，仅演示顶部导航</div>`}function render(){document.querySelector('#app').innerHTML=header()+content();document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;group='需求';current='需求列表';opened=v==='c';history.replaceState(null,'','?variant='+v);render()});render();
</script></body></html>
