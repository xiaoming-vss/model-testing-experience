[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtx-api-ui-worker"
version = "0.1.0"
description = "MTX worker for UI and API test execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.52.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
]

[project.scripts]
mtx-api-ui-worker = "test_worker.__main__:main"
# Compatibility alias for existing deployments.
testing-agent-api-ui-worker = "test_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
