[worker]
worker_id = "ai-worker-01"
poll_interval_seconds = 5
heartbeat_interval_seconds = 15
max_concurrent_tasks = 2
# 单次测试点审查及本 Worker 进程的并发上限
traceable_review_concurrency = 4
traceable_review_global_concurrency = 4
run_once = false

[platform]
base_url = "http://127.0.0.1:9000"
worker_token = ""
task_claim_path = "/internal/ai-worker/tasks/claim"
task_snapshot_path = "/internal/ai-worker/tasks/{task_id}/snapshot"
task_started_path = "/internal/ai-worker/tasks/{task_id}/started"
task_heartbeat_path = "/internal/ai-worker/tasks/{task_id}/heartbeat"
task_progress_path = "/internal/ai-worker/tasks/{task_id}/progress"
task_completed_path = "/internal/ai-worker/tasks/{task_id}/completed"
task_llm_credentials_path = "/internal/ai-worker/tasks/{task_id}/llm-credentials"
request_timeout_seconds = 60

[agent]
backend = "nanobot"

[agent.nanobot]
runtime_root = "runtime"
stream_idle_timeout_seconds = 300
provider_request_timeout_seconds = 300

[agent.pi]
runtime_root = "runtime"
stream_idle_timeout_seconds = 300
executable = "pi"
run_timeout_seconds = 1800
api = "openai-completions"
context_window_tokens = 500000
max_output_tokens = 65536
reasoning = false
thinking_level = "off"

# 当前仅支持 Pi 后端；[agent].backend 为 nanobot 时任务会明确失败。
[code_risk_analysis]
# 兼容旧配置；代码拉取与本地 diff 使用下方 git_timeout_seconds
gitlab_timeout_seconds = 120
# 单次 git 命令超时;代码拉取、checkout 与本地 diff 共用
git_timeout_seconds = 300
# 失败 run 的代码工作区保留时长;成功 run 立即删除
workspace_retention_hours = 24
# 预置 diff 字符预算;超出时按文件记录到 truncatedFiles
max_diff_chars = 1000000
# 单次 run 允许绑定的仓库数上限
max_repos = 20

# 当前仅支持 Pi 后端；[agent].backend 为 nanobot 时任务会明确失败。
[repository_profile]
# 单次 git 命令超时;仓库画像只 checkout 工作分支 HEAD
git_timeout_seconds = 300
# 失败 run 的代码工作区保留时长;成功 run 立即删除
workspace_retention_hours = 24
# 单次 run 允许分析的仓库数上限
max_repos = 20
# 模型输出 JSON 字符上限
max_output_chars = 100000

# UI 用例生成的仓库源码准备;只 clone 一个冻结 commit 的仓库
[ui_generation]
# 单次 git 命令超时;clone、fetch 和 checkout 共用
git_timeout_seconds = 300
# 失败 run 的工作区保留时长;成功 run 立即删除
workspace_retention_hours = 24
# checkout 后工作树大小上限(不含 .git)
max_repo_size_mb = 500
# checkout 后工作树文件数上限(不含 .git)
max_repo_files = 200000

[logging]
level = "INFO"
console = true
dir = "logs"
filename = "worker.log"
retention_days = 7
