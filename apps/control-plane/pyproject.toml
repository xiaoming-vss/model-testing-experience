[project]
name = "mtx-control-plane"
version = "0.1.0"
description = "Model Testing Experience control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "pymysql>=1.1.1",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "reportlab>=4.2.0",
    "cryptography>=44.0.0",
    "pycasbin>=1.43,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-PyYAML>=6.0.0",
    "types-reportlab>=4.0.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
mtx-control-plane = "testing_agent.main:main"
# Compatibility alias for existing deployments.
testing-agent-control-plane = "testing_agent.main:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "testing_agent"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["B008"]
