env = "local"

[http]
host = "127.0.0.1"
port = 9000

[security.jwt]
key = "replace-with-local-jwt-secret"
expire_hours = 168

[security.integration]
key = "replace-with-local-integration-key"

[security.worker]
key = "replace-with-local-worker-key"

[security.integration_worker]
key = ""

[integration_execution]
enabled = false
project_ids = []
all_projects = false
accept_submissions = true
claim_enabled = true
lease_seconds = 60
runtime_generation = ""
succeeded_retention_days = 30
failed_retention_days = 90
maintenance_batch_size = 100
restore_review_max_age_seconds = 3600
worker_presence_ttl_seconds = 120

[data.db.user]
driver = "mysql"
dsn = "mysql+asyncmy://root:password@127.0.0.1:3306/testing-agent-python?charset=utf8mb4"

[storage]


[code_overview]
# 迭代代码概览缓存窗口(秒),默认 300(5 分钟)
cache_ttl_seconds = 300

# S3 私有桶；签名地址必须同时可被浏览器和 Worker 访问。
[storage.s3]
enabled = false
endpoint = ""
region = "us-east-1"
bucket = ""
access_key = ""
secret_key = ""
prefix = "mtx"
addressing_style = "path"
signature_seconds = 900
temporary_hours = 24
max_bytes = 104857600
