[project]
name = "mtx-integration-worker"
version = "0.1.0"
description = "Independent integration execution worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.0", "pydantic>=2.10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0", "mypy>=1.15.0"]

[project.scripts]
mtx-integration-worker = "testing_agent_integration_worker.main:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "testing_agent_integration_worker"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
