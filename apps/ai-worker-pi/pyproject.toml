[project]
name = "mtx-ai-worker-pi"
version = "0.1.0"
description = "MTX worker for platform-driven API and functional test generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "pydantic",
    "pyyaml",
    "jsonschema>=4.23,<5",
]

[project.scripts]
mtx-ai-worker-pi = "testing_agent_ai_worker_pi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests support direct execution by adding src to sys.path before project imports.
"tests/**/*.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/testing_agent_ai_worker_pi"]
