[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testing-agent-connector-zentao"
version = "0.1.0"
description = "FastAPI service for wrapping Zentao and exposing unified external APIs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "uvicorn>=0.48.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
