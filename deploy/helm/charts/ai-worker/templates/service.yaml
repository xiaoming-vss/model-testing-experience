apiVersion: v1
kind: Service
metadata:
  name: ai-worker
  labels:
    {{- include "ai-worker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: health
      port: {{ .Values.healthPort }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "ai-worker.selectorLabels" . | nindent 4 }}
