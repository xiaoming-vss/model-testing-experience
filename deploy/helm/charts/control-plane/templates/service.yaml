apiVersion: v1
kind: Service
metadata:
  name: control-plane
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "control-plane.selectorLabels" . | nindent 4 }}
