global: {}

replicaCount: 2

image:
  registry: ""
  repository: mtx/control-plane
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Complete control-plane TOML. Contains secrets; provide it through a
# user-managed values file, not the committed defaults.
configToml: ""

service:
  type: ClusterIP
  port: 9000

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources: {}

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 60

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
