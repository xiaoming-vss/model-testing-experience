# api-ui-worker 运行配置；由 values.config 渲染成 TOML，
# 挂载到容器的 /app/config.toml。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-ui-worker.fullname" . }}-config
  labels:
    {{- include "api-ui-worker.labels" . | nindent 4 }}
data:
  config.toml: |
{{ include "api-ui-worker.configToml" . | indent 4 }}
