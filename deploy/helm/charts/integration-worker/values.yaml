# integration-worker chart 的默认 values。
# 部署时复制本文件到 Git 外（例如 .runtime/k8s/integration-worker-values.yaml），
# 只覆盖需要修改的字段即可；Helm 会与这里的默认值合并。

# 独立集成 Worker 副本数；该 chart 使用单块 RWO PVC，建议保持 1。
replicaCount: 1

# 容器镜像。registry 为空时直接使用 repository。
image:
  registry: ""
  repository: mtx/integration-worker
  tag: local
  pullPolicy: Always

# 拉取私有镜像使用的 Secret，例如：
# imagePullSecrets:
#   - name: mtx-registry
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# 结构化 integration-worker 配置。chart 会把它渲染成 ConfigMap 的
# local.toml，结构与 worker TOML 一一对应。
config:
  # 控制面地址和专属 Worker 令牌。
  # worker_token 必须与控制面的 security.integration_worker.key 一致。
  control_plane:
    base_url: http://control-plane:9000
    worker_token: ""
    timeout_seconds: 15
    retry_attempts: 3

  worker:
    poll_interval_seconds: 2
    heartbeat_interval_seconds: 10
    lease_margin_seconds: 2
    shutdown_grace_seconds: 210
    # 这两个路径必须与 Deployment 挂载的 /app/runtime 保持一致。
    health_file: /app/runtime/health.json
    evidence_file: /app/runtime/evidence.json
    health_max_age_seconds: 90

# /app/runtime 的 PVC 配置。
persistence:
  runtimeSize: 5Gi
  storageClass: ""

# 容器资源限制和调度配置。
resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# 收到 SIGTERM 后等待退出的时间。
terminationGracePeriodSeconds: 215

# Pod 级安全上下文；PVC 和 ConfigMap 需要 fsGroup 才能被 10001 用户读写。
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

# 容器级安全上下文；只读根文件系统，丢弃全部 capability。
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
