apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "integration-worker.fullname" . }}-runtime
  labels:
    {{- include "integration-worker.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.runtimeSize }}
