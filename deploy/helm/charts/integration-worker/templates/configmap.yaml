# integration-worker 运行配置；由 values.config 渲染成 TOML，
# 挂载到容器的 /app/config/local.toml。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "integration-worker.fullname" . }}-config
  labels:
    {{- include "integration-worker.labels" . | nindent 4 }}
data:
  local.toml: |
{{ include "integration-worker.configToml" . | indent 4 }}
