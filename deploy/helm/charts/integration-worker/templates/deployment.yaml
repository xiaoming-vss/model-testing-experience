apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "integration-worker.fullname" . }}
  labels:
    {{- include "integration-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "integration-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "integration-worker.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: integration-worker
          image: {{ include "integration-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_CONF
              value: /app/config/local.toml
          volumeMounts:
            - name: config
              mountPath: /app/config/local.toml
              subPath: local.toml
              readOnly: true
            - name: runtime
              mountPath: /app/runtime
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - mtx-integration-worker
                - --config
                - /app/config/local.toml
                - --healthcheck
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mtx-integration-worker
                - --config
                - /app/config/local.toml
                - --healthcheck
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - mtx-integration-worker
                - --config
                - /app/config/local.toml
                - --healthcheck
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "integration-worker.fullname" . }}-config
            defaultMode: 0440
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "integration-worker.fullname" . }}-runtime
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
