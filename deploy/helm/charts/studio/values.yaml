# studio chart 的默认 values。
# 部署时复制本文件到 Git 外（例如 .runtime/k8s/studio-values.yaml），
# 只覆盖需要修改的字段即可；Helm 会与这里的默认值合并。

# 前端副本数。
replicaCount: 1

# 容器镜像。registry 为空时直接使用 repository。
image:
  registry: ""
  repository: mtx/studio
  tag: local
  pullPolicy: Always

# 拉取私有镜像使用的 Secret，例如：
# imagePullSecrets:
#   - name: mtx-registry
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# 前端运行配置。chart 会渲染成 ConfigMap，再通过 envFrom 注入容器。
config:
  # Studio nginx 反向代理的控制面地址。
  # 控制面 Service 名固定为 control-plane，端口默认 9000。
  apiUpstream: http://control-plane:9000

# Studio Service。默认 NodePort 30080，浏览器通过节点 IP 访问。
service:
  type: NodePort
  port: 80
  nodePort: 30080

# 容器资源限制和调度配置。
resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# 收到 SIGTERM 后等待退出的时间。
terminationGracePeriodSeconds: 30
