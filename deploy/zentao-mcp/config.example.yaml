port: ":9090"
enable_toon: false
telemetry:
  endpoint: ""
  insecure: true
servers:
  - name: zentao
    # OpenAPI schema is already included in the published image.
    schema_url: /config/zentao-openapi.json
    # API v2 address reachable from the MCP container.
    base_url: "https://zentao.example.test/api.php/v2"
    # Browser address of the same ZenTao instance; preserve installation subpaths.
    instance_url: "https://zentao.example.test"
    # Attachment tools require the attachment-enabled image (see deployment guide).
    # Exact origin of the platform S3 signed download URLs, reachable from MCP.
    attachment_source_origins: ["https://s3.example.test"]
    # Match platform, S3, PHP and reverse-proxy limits (default 100 MiB).
    attachment_max_bytes: 104857600
    allow:
      - methods: [GET, POST, PUT, DELETE]
        regex: ".*"
    block: []
