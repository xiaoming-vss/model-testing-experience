# python3 scripts/manage.py init 会生成本地 platform.toml 并随机填入密钥。
[shared]
# 浏览器可访问的主机名/IP；部署到服务器时修改此处，不包含协议或端口。
public_host = "127.0.0.1"
# Docker 发布端口的监听地址；需要远程访问时改为 0.0.0.0。
bind_host = "127.0.0.1"
# 本地开发时后端、禅道服务的主机；内置 MySQL 的本地访问也使用此地址。
local_host = "127.0.0.1"
studio_port = 8081
control_plane_port = 19000
zentao_port = 8010
artifacts_port = 9010
mysql_port = 13306
worker_token = "GENERATE"
jwt_key = "GENERATE"
integration_key = "GENERATE"

[database]
# 已有 MySQL：填写完整 URL。非空时优先使用，下面的内置数据库字段不再需要。
# 示例：mysql+asyncmy://用户名:密码@127.0.0.1:3306/数据库名?charset=utf8mb4
# 留空则维持内置 MySQL 模式。密码中的 @、#、/、% 等字符需要 URL 编码。
url = ""

# 仅内置 MySQL 模式使用：
name = "testing_agent"
user = "testing_agent"
password = "GENERATE"
root_password = "GENERATE"

# 以下配置覆盖各项目的示例配置；地址、令牌和存储路径由 shared 统一生成。
[control_plane.code_overview]
cache_ttl_seconds = 300

[ai_worker.worker]
max_concurrent_tasks = 2
poll_interval_seconds = 5

[ai_worker.nanobot]
stream_idle_timeout_seconds = 300
provider_request_timeout_seconds = 300

[api_ui_worker.ui]
headless = true
trace_enabled = true
screenshot_on_failure = true

[zentao.zentao]
timeout_seconds = 15
verify_ssl = true
