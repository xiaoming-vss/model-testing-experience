# python3 scripts/manage.py init 会生成本地 platform.toml 并随机填入密钥。
[shared]
# 浏览器可访问的主机名/IP；部署到服务器时修改此处，不包含协议或端口。
public_host = "127.0.0.1"
# Docker 发布端口的监听地址；需要远程访问时改为 0.0.0.0。
bind_host = "127.0.0.1"
# 本地开发时后端的主机；内置 MySQL 的本地访问也使用此地址。
local_host = "127.0.0.1"
studio_port = 8081
control_plane_port = 19000
mysql_port = 13306
worker_token = "GENERATE"
# 独立集成 Worker 专属认证；不得与 AI/API/UI Worker 令牌相同。
integration_worker_token = "GENERATE"
# 多个控制面实例共享该代次；隔离恢复时生成新值并更换集成 Worker 令牌。
integration_runtime_generation = "GENERATE"
jwt_key = "GENERATE"
integration_key = "GENERATE"

[database]
# 已有 MySQL：填写完整 URL。非空时优先使用，下面的内置数据库字段不再需要。
# 示例：mysql+asyncmy://用户名:密码@127.0.0.1:3306/数据库名?charset=utf8mb4
# 留空则维持内置 MySQL 模式。密码中的 @、#、/、% 等字符需要 URL 编码。
url = ""

# 内置 MySQL 慢查询观测；日志写入 mysql-data 卷中的 slow-queries.log。
# 外部 MySQL 由数据库管理员配置同等选项。
slow_query_log = true
long_query_time = 0.5

# 仅内置 MySQL 模式使用：
name = "testing_agent"
user = "testing_agent"
password = "GENERATE"
root_password = "GENERATE"

# 以下配置覆盖各项目的示例配置；地址、令牌和存储路径由 shared 统一生成。
[control_plane.code_overview]
cache_ttl_seconds = 300

# 每个控制面进程的资产导入预算；超限请求明确拒绝，整批导入保持原子性。
[control_plane.asset_import]
max_bytes = 8388608
max_items = 10000
max_field_chars = 262144
max_depth = 32
max_nodes = 200000
max_concurrent = 2

[control_plane.security.super_admin]
# 系统预置的唯一超级管理员；用户名和邮箱必须提供。
username = "admin"
email = "admin@example.com"
# init/upgrade-config 会生成随机值；生产环境必须替换为显式密码。
initial_password = "GENERATE"

[control_plane.security.login]
# 连续失败锁定与同 IP + 用户名限流共用该阈值。
max_failures = 5
lock_minutes = 15
rate_limit_window_minutes = 15

[control_plane.security.jwt]
# 普通本地账号与超级管理员的 JWT 有效期。
user_expire_hours = 72
super_admin_expire_hours = 24

[control_plane.integration_execution]
# 默认关闭；完成真实链路和项目验收后，按项目灰度启用。
enabled = false
project_ids = []
all_projects = false
accept_submissions = true
claim_enabled = true
lease_seconds = 60
succeeded_retention_days = 30
failed_retention_days = 90
# 领取回执保留窗口（天）；窗口外回执由维护任务清理，此后重放同一领取请求按新请求处理。
claim_receipt_retention_days = 14
maintenance_batch_size = 100
restore_review_max_age_seconds = 3600
worker_presence_ttl_seconds = 120

[ai_worker.worker]
max_concurrent_tasks = 2
poll_interval_seconds = 5

[ai_worker.nanobot]
stream_idle_timeout_seconds = 300
provider_request_timeout_seconds = 300

[api_ui_worker.ui]
headless = true
trace_enabled = true
screenshot_on_failure = true

[integration_worker.worker]
poll_interval_seconds = 2
heartbeat_interval_seconds = 10
shutdown_grace_seconds = 210

# S3 私有桶；签名地址必须同时可被浏览器和 Worker 访问。
[control_plane.storage.s3]
enabled = false
endpoint = ""
region = "us-east-1"
bucket = ""
access_key = ""
secret_key = ""
prefix = "mtx"
addressing_style = "path"
signature_seconds = 900
temporary_hours = 24
max_bytes = 104857600
# LDAP 认证仅在管理员页面配置，存储于数据库。
