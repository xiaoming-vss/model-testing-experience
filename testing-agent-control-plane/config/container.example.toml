env = "production"

[http]
host = "0.0.0.0"
port = 9000

[security.jwt]
key = "replace-with-strong-jwt-secret"
expire_hours = 168

[security.integration]
key = "replace-with-strong-integration-key"

[security.worker]
key = "replace-with-strong-worker-key"

[data.db.user]
driver = "mysql"
dsn = "mysql+asyncmy://testing_agent:replace-with-db-password@mysql:3306/testing_agent?charset=utf8mb4"

[storage]
uploads_dir = "/app/storage/ai-generate-task-sources"

[integrations.zentao_service]
base_url = "http://zentao-service:8010"

[code_overview]
# 迭代代码概览缓存窗口(秒),默认 300(5 分钟)
cache_ttl_seconds = 300
